name: Debug Facebook JSON

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Extract JSON from HTML
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests cloudscraper beautifulsoup4 --quiet
          python3 - <<PYEOF
          import cloudscraper, json, re
          from bs4 import BeautifulSoup

          scraper = cloudscraper.create_scraper(
              browser={"browser": "chrome", "platform": "windows", "mobile": False}
          )

          r = scraper.get("https://mbasic.facebook.com/competitionalgerie", timeout=20)
          print(f"Status: {r.status_code} | HTML: {len(r.text)} chars")

          soup = BeautifulSoup(r.text, "html.parser")

          # Extraire tous les blocs JSON embarqués dans les <script type="application/json">
          json_blocks = soup.find_all("script", {"type": "application/json"})
          print(f"Blocs JSON trouvés: {len(json_blocks)}")

          for i, block in enumerate(json_blocks):
              content = block.string or ""
              size = len(content)
              if size < 500:
                  continue
              print(f"\n--- Bloc {i} ({size} chars) ---")
              # Chercher des URLs d'images fbcdn
              imgs = re.findall(r'https:\\?/\\?/[^"\'\\]+fbcdn[^"\'\\]+\.jpg[^"\'\\]*', content)
              imgs += re.findall(r'https:\\?/\\?/[^"\'\\]+fbcdn[^"\'\\]+\.png[^"\'\\]*', content)
              if imgs:
                  print(f"  Images fbcdn: {len(imgs)}")
                  for img in imgs[:3]:
                      clean = img.replace('\\/', '/').replace('\\\\', '')
                      print(f"    {clean[:120]}")

              # Chercher texte "la une" ou "competition"
              cl = content.lower()
              for kw in ["la une", "competition du", "une de", "edition du"]:
                  idx = cl.find(kw)
                  if idx >= 0:
                      print(f"  Keyword '{kw}' à pos {idx}: ...{content[max(0,idx-30):idx+80]}...")

              # Essayer de parser comme JSON et chercher des clés utiles
              try:
                  data = json.loads(content)
                  txt = json.dumps(data)
                  if "fbcdn" in txt or "photo" in txt.lower():
                      print(f"  JSON parsé OK, contient fbcdn/photo")
                      # Chercher récursivement les URLs d'images
                      def find_urls(obj, depth=0):
                          if depth > 10: return []
                          urls = []
                          if isinstance(obj, str) and "fbcdn" in obj and (".jpg" in obj or ".png" in obj):
                              urls.append(obj)
                          elif isinstance(obj, dict):
                              for v in obj.values():
                                  urls += find_urls(v, depth+1)
                          elif isinstance(obj, list):
                              for v in obj:
                                  urls += find_urls(v, depth+1)
                          return urls
                      found_urls = find_urls(data)
                      print(f"  URLs images trouvées: {len(found_urls)}")
                      for u in found_urls[:3]:
                          print(f"    {u[:120]}")
              except:
                  pass

          PYEOF