name: Debug Facebook JSON

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Extract JSON from HTML
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests cloudscraper beautifulsoup4 --quiet
          python3 - <<PYEOF
          import cloudscraper, json, re
          from bs4 import BeautifulSoup

          scraper = cloudscraper.create_scraper(
              browser={"browser": "chrome", "platform": "windows", "mobile": False}
          )

          r = scraper.get("https://mbasic.facebook.com/competitionalgerie", timeout=20)
          print(f"Status: {r.status_code} | HTML: {len(r.text)} chars")

          soup = BeautifulSoup(r.text, "html.parser")
          json_blocks = soup.find_all("script", {"type": "application/json"})
          print(f"Blocs JSON trouves: {len(json_blocks)}")

          for i, block in enumerate(json_blocks):
              content = block.string or ""
              size = len(content)
              if size < 500:
                  continue
              print(f"\n--- Bloc {i} ({size} chars) ---")

              # Chercher URLs fbcdn simplement avec in + split
              if "fbcdn" in content:
                  parts = content.split("fbcdn")
                  print(f"  Mentions fbcdn: {len(parts)-1}")
                  for p in parts[1:4]:
                      snippet = "https://scontent" + "fbcdn" + p[:100]
                      print(f"    ...fbcdn{p[:100]}")

              # Chercher keywords
              cl = content.lower()
              for kw in ["la une", "competition du", "une de", "edition du"]:
                  idx = cl.find(kw)
                  if idx >= 0:
                      print(f"  Keyword '{kw}': ...{content[max(0,idx-30):idx+80]}...")

              # Parser JSON
              try:
                  data = json.loads(content)
                  txt = json.dumps(data)
                  if "fbcdn" in txt:
                      print(f"  JSON parse OK, contient fbcdn")
                      def find_urls(obj, depth=0):
                          if depth > 15: return []
                          urls = []
                          if isinstance(obj, str) and "fbcdn" in obj and ".jpg" in obj:
                              urls.append(obj)
                          elif isinstance(obj, dict):
                              for v in obj.values():
                                  urls += find_urls(v, depth+1)
                          elif isinstance(obj, list):
                              for v in obj:
                                  urls += find_urls(v, depth+1)
                          return urls
                      found = find_urls(data)
                      print(f"  URLs .jpg fbcdn: {len(found)}")
                      for u in found[:5]:
                          print(f"    {u[:120]}")
              except Exception as e:
                  pass

          PYEOF