name: Predictions Engine

on:
  schedule:
    - cron: '30 0 * * *'    # 00h30 UTC — Engine principal (quota réinitialisé à 00h00 UTC = 20h00 Montreal)
    - cron: '30 1 * * *'    # 01h30 UTC — Top 25 (21h30 Montreal)
    - cron: '0 8-23 * * *'  # Toutes les heures 8h-23h — replace/verify/odds

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - engine
          - top25
          - verify
          - replace
          - odds
          - analyze

jobs:

  predictions-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run engine
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          echo "Mode: $MODE · $(date -u)"
          HOUR=$(date -u +%H)
          if [ "$MODE" = "engine" ] || ([ "$MODE" = "all" ] && [ "$HOUR" = "00" ]); then
            python predictions_master.py
          else
            echo "Skip engine (mode=$MODE, hour=$HOUR)"
          fi

  daily-top25:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: predictions-engine
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run top25
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          if [ "$MODE" = "top25" ] || ([ "$MODE" = "all" ] && [ "$HOUR" = "01" ] && [ "$MINUTE" -ge "30" ]); then
            python daily_top25.py
          else
            echo "Skip top25 (mode=$MODE, time=${HOUR}:${MINUTE})"
          fi

  verify-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run verify
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "verify" ] || [ "$MODE" = "all" ]; then
            python verify_results.py
          else
            echo "Skip verify (mode=$MODE)"
          fi

  replace-finished:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run replace
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "replace" ] || [ "$MODE" = "all" ]; then
            python replace_finished.py
          else
            echo "Skip replace (mode=$MODE)"
          fi

  market-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - name: Run market stats
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "all" ]; then
            python market_stats.py
          else
            echo "Skip market stats"
          fi

  analyze-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - name: Run analyze
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "analyze" ]; then
            python analyze_performance.py
          else
            echo "Skip analyze"
          fi