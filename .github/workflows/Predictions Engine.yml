name: Predictions Engine

on:
  schedule:
    - cron: '30 0 * * *'    # 00h30 UTC — Engine tentative 1 (quota réinitialisé à 00h00 UTC = 20h00 Montreal)
    - cron: '0 1 * * *'     # 01h00 UTC — Engine tentative 2 (si la 1 sautée)
    - cron: '30 1 * * *'    # 01h30 UTC — Engine tentative 3 + Top 25
    - cron: '0 2 * * *'     # 02h00 UTC — Top 25 tentative 2
    - cron: '0 3-7 * * *'   # 03h-07h UTC — verify nuit (matchs tardifs Amérique/CdM)
    - cron: '0 8-23 * * *'  # Toutes les heures 8h-23h — replace/verify/odds

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - engine
          - top25
          - verify
          - replace
          - odds
          - analyze

# ── ANTI-RACE ─────────────────────────────────────────────────────────────────
# Un seul run du workflow à la fois. Empêche deux crons rapprochés (00h30/01h00)
# de tourner en parallèle et de se marcher dessus sur daily_top25 (delete+insert).
# cancel-in-progress: false = on ne tue jamais un run en cours, on le laisse finir
# (le suivant attend son tour, puis la garde anti-doublon le fait passer en SKIP).
concurrency:
  group: predictions-engine
  cancel-in-progress: false

jobs:

  predictions-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run engine
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          echo "Mode: $MODE · $(date -u)"
          HOUR=$(date -u +%H)
          # Engine sur fenêtres 00h et 01h (tentatives multiples).
          # La protection anti-doublon dans predictions_master.py empêche
          # une 2e exécution si les prédictions du jour sont déjà publiées.
          if [ "$MODE" = "engine" ] || ([ "$MODE" = "all" ] && { [ "$HOUR" = "00" ] || [ "$HOUR" = "01" ]; }); then
            python predictions_master.py
          else
            echo "Skip engine (mode=$MODE, hour=$HOUR)"
          fi

  daily-top25:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: predictions-engine
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run top25
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          HOUR=$(date -u +%H)
          # 10# force la base 10 : sans ça, "08" et "09" plantent l'arithmétique
          # bash (interprétés comme octal invalide). Bug classique et silencieux.
          H=$((10#$HOUR))
          # `needs: predictions-engine` garantit DÉJÀ que le moteur a fini avant
          # ce job. Plus de fenêtre 01h30-02h fragile qui sautait dès que le moteur
          # finissait vite (tout l'été) : on couvre 00h-02h, ce qui attrape le
          # moteur quelle que soit sa durée (timeout 90 min depuis 00h30 -> fini
          # au plus tard à 02h). La garde anti-doublon du script évite tout doublon.
          if [ "$MODE" = "top25" ] || [ "$MODE" = "engine" ] || { [ "$MODE" = "all" ] && [ "$H" -le 2 ]; }; then
            python daily_top25.py
          else
            echo "Skip top25 (mode=$MODE, hour=$HOUR)"
          fi

  verify-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run verify
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "verify" ] || [ "$MODE" = "all" ]; then
            python verify_results.py
          else
            echo "Skip verify (mode=$MODE)"
          fi

  replace-finished:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run replace
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "replace" ] || [ "$MODE" = "all" ]; then
            python replace_finished.py
          else
            echo "Skip replace (mode=$MODE)"
          fi

  market-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - name: Run market stats
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "all" ]; then
            python market_stats.py
          else
            echo "Skip market stats"
          fi

  analyze-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - name: Run ticket analysis
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "all" ]; then
            python analyze_tickets.py
          else
            echo "Skip ticket analysis"
          fi

  analyze-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - name: Run analyze
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "analyze" ]; then
            python analyze_performance.py
          else
            echo "Skip analyze"
          fi