name: Predictions Engine

on:
  schedule:
    - cron: '0 3 * * *'     # Vérification résultats J-1
    - cron: '0 4 * * *'     # Moteur principal
    - cron: '30 5 * * *'    # Top 25 sélection
    - cron: '0 8-23 * * *'  # Remplacement horaire 08h-23h UTC

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - engine
          - top25
          - verify
          - replace

jobs:

  predictions-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run engine
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'engine' }}"
          if [ "$MODE" = "engine" ] || [ "$MODE" = "all" ]; then
            python predictions_master.py
          fi

  daily-top25:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '30 5 * * *')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run top25
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'top25' }}"
          if [ "$MODE" = "top25" ] || [ "$MODE" = "all" ]; then
            python daily_top25.py
          fi

  verify-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run verify
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'verify' }}"
          if [ "$MODE" = "verify" ] || [ "$MODE" = "all" ]; then
            python verify_results.py
          fi

  replace-finished:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 8-23 * * *')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run replace
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'replace' }}"
          if [ "$MODE" = "replace" ] || [ "$MODE" = "all" ]; then
            python replace_finished.py
          fi

  market-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - name: Run market stats
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: python market_stats.py