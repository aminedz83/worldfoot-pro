name: Predictions Engine

on:
  schedule:
    - cron: '0 4 * * *'    # Moteur principal 04h00 UTC
    - cron: '30 5 * * *'   # Top 25 05h30 UTC
    - cron: '0 3 * * *'    # Vérification résultats 03h00 UTC

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (engine / top25 / verify / all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - engine
          - top25
          - verify

jobs:

  predictions-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests supabase

      - name: Run engine
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'engine' }}"
          if [ "$MODE" = "engine" ] || [ "$MODE" = "all" ]; then
            python predictions_master.py
          else
            echo "Mode $MODE — skip engine"
          fi

  daily-top25:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '30 5 * * *')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests supabase

      - name: Run top25
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'top25' }}"
          if [ "$MODE" = "top25" ] || [ "$MODE" = "all" ]; then
            python daily_top25.py
          else
            echo "Mode $MODE — skip top25"
          fi

  verify-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests supabase

      - name: Run verify
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'verify' }}"
          if [ "$MODE" = "verify" ] || [ "$MODE" = "all" ]; then
            python verify_results.py
          else
            echo "Mode $MODE — skip verify"
          fi