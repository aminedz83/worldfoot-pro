name: Predictions Engine

on:
  schedule:
    - cron: '0 4 * * *'      # 04h00 UTC — engine principal
    - cron: '30 5 * * *'     # 05h30 UTC — Top 25
    - cron: '0 3 * * *'      # 03h00 UTC — vérification résultats J-1
    - cron: '0 10-23 * * *'  # 10h-23h — remplacement + surveillance cotes

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - engine
          - top25
          - verify
          - replace
          - odds

jobs:

  predictions-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 4 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run engine
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'engine' }}"
          echo "Mode: $MODE · $(date -u)"
          if [ "$MODE" = "engine" ] || [ "$MODE" = "all" ]; then
            echo "Lancement predictions_master.py..."
            python predictions_master.py
          else
            echo "Skip engine (mode=$MODE)"
          fi

  daily-top25:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: predictions-engine
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run top25
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "top25" ] || [ "$MODE" = "all" ]; then
            python daily_top25.py
          else
            echo "Skip top25 (mode=$MODE)"
          fi

  verify-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 3 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run verify
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'verify' }}"
          if [ "$MODE" = "verify" ] || [ "$MODE" = "all" ]; then
            python verify_results.py
          else
            echo "Skip verify (mode=$MODE)"
          fi

  replace-finished:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 10-23 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run replace
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'replace' }}"
          if [ "$MODE" = "replace" ] || [ "$MODE" = "all" ]; then
            python replace_finished.py
          else
            echo "Skip replace (mode=$MODE)"
          fi

  odds-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 10-23 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Run odds monitor
        env:
          API_FOOTBALL_KEY:     ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'odds' }}"
          if [ "$MODE" = "odds" ] || [ "$MODE" = "all" ]; then
            python odds_monitor.py
          else
            echo "Skip odds monitor (mode=$MODE)"
          fi

  market-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 4 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - name: Run market stats
        env:
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          if [ "$MODE" = "all" ]; then
            python market_stats.py
          else
            echo "Skip market stats"
          fi