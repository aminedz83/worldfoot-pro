name: Algeria Lineups Scraper
on:
  schedule:
    - cron: '*/5 7-16 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scrape Soccerway Lineups
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
