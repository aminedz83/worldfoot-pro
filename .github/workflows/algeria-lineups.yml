def get_today_fixtures():
    """Récupère les matchs du jour depuis Soccerway Ligue 1"""
    url = "https://ca.soccerway.com/algeria/ligue-1/fixtures/"
    try:
        r = requests.get(url, headers=HEADERS, timeout=20)
        print(f"Soccerway status: {r.status_code}")
        soup = BeautifulSoup(r.text, "html.parser")
        
        matches = []
        today_str = date.today().strftime("%Y-%m-%d")
        
        # Chercher toutes les lignes de match
        for row in soup.find_all("tr", class_=re.compile(r"match")):
            try:
                # Trouver le lien du match
                links = row.find_all("a", href=re.compile(r"/game/|/matches/"))
                match_url = None
                mid = None
                
                for link in links:
                    href = link.get("href", "")
                    mid_search = re.search(r"mid=([A-Za-z0-9]+)", href)
                    if mid_search:
                        mid = mid_search.group(1)