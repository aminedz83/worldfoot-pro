name: Algeria Lineups Scraper
on:
  schedule:
    - cron: '*/5 7-16 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scrape Soccerway Lineups
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests beautifulsoup4 --quiet
          python3 - <<PYEOF
import requests
import os
import json
import re
from datetime import datetime, timezone, date
from bs4 import BeautifulSoup

SUPABASE_KEY = os.environ["SUPABASE_KEY"]
SB_URL = "https://iqeqlsxjiklygywjirqs.supabase.co"
SB_HEADERS = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    "Prefer": "resolution=merge-duplicates"
}

HEADERS = {
    "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1",
    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
    "Accept-Language": "fr-FR,fr;q=0.9",
    "Accept-Encoding": "gzip, deflate, br",
    "Connection": "keep-alive"
}

# IDs SofaScore → API football.com pour les 16 clubs Ligue 1 algérienne
ALGERIA_TEAMS = {
    "MC Alger": {"sofascore": 42204, "api_football": 904},
    "JS Saoura": {"sofascore": 79565, "api_football": None},
    "Olympique Akbou": {"sofascore": 306567, "api_football": None},
    "CS Constantine": {"sofascore": 55393, "api_football": 916},
    "MC Oran": {"sofascore": 45001, "api_football": None},
    "CR Belouizdad": {"sofascore": 42207, "api_football": 905},
    "JS Kabylie": {"sofascore": 42202, "api_football": 918},
    "ES Ben Aknoun": {"sofascore": 133444, "api_football": None},
    "USM Alger": {"sofascore": 42206, "api_football": 906},
    "USM Khenchela": {"sofascore": 238384, "api_football": None},
    "ASO Chlef": {"sofascore": 42201, "api_football": None},
    "MB Rouissat": {"sofascore": 238383, "api_football": None},
    "ES Setif": {"sofascore": 41756, "api_football": 908},
    "Paradou AC": {"sofascore": 212197, "api_football": None},
    "ES Mostaganem": {"sofascore": 186100, "api_football": None},
    "MC El Bayadh": {"sofascore": 133466, "api_football": None},
}

def get_today_fixtures():
    """Récupère les matchs du jour depuis Soccerway Ligue 1"""
    url = "https://ca.soccerway.com/algeria/ligue-1/fixtures/"
    try:
        r = requests.get(url, headers=HEADERS, timeout=20)
        print(f"Soccerway status: {r.status_code}")
        soup = BeautifulSoup(r.text, "html.parser")
        
        matches = []
        today_str = date.today().strftime("%Y-%m-%d")
        
        # Chercher toutes les lignes de match
        for row in soup.find_all("tr", class_=re.compile(r"match")):
            try:
                # Trouver le lien du match
                links = row.find_all("a", href=re.compile(r"/game/|/matches/"))
                match_url = None
                mid = None
                
                for link in links:
                    href = link.get("href", "")
                    mid_search = re.search(r"mid=([A-Za-z0-9]+)", href)
                    if mid_search:
                        mid = mid_search.group(1)
                        match_url = "https://ca.soccerway.com" + href if href.startswith("/") else href
                        break
                
                if not mid:
                    continue
                
                # Équipes
                team_links = row.find_all("a", href=re.compile(r"/teams/"))
                home, away = "", ""
                if len(team_links) >= 2:
                    home = team_links[0].get_text(strip=True)
                    away = team_links[1].get_text(strip=True)
                
                # Date du match
                date_cell = row.find("td", class_=re.compile(r"date"))
                match_date = today_str
                if date_cell:
                    date_text = date_cell.get_text(strip=True)
                    try:
                        parsed = datetime.strptime(date_text, "%d/%m/%Y")
                        match_date = parsed.strftime("%Y-%m-%d")
                    except:
                        pass
                
                # Seulement les matchs du jour
                if match_date == today_str and mid and home:
                    matches.append({
                        "mid": mid,
                        "home": home,
                        "away": away,
                        "date": match_date,
                        "url": f"https://ca.soccerway.com/game/x/x/summary/lineups/?mid={mid}"
                    })
                    print(f"Match trouvé: {home} vs {away} | mid={mid}")
                    
            except Exception as e:
                continue
        
        return matches
        
    except Exception as e:
        print(f"Erreur get_today_fixtures: {e}")
        return []

def scrape_lineups(mid):
    """Scrape les lineups depuis Soccerway"""
    url = f"https://ca.soccerway.com/game/x/x/summary/lineups/?mid={mid}"
    try:
        r = requests.get(url, headers=HEADERS, timeout=20)
        if r.status_code != 200:
            print(f"Status {r.status_code} pour mid={mid}")
            return None
        
        soup = BeautifulSoup(r.text, "html.parser")
        
        # Vérifier si lineups disponibles
        starting = soup.find(string=re.compile(r"STARTING LINEUP", re.I))
        if not starting:
            print(f"Pas encore de lineups pour mid={mid}")
            return None
        
        home_players = []
        away_players = []
        
        # Parser les joueurs depuis les tableaux
        tables = soup.find_all("table")
        for table in tables:
            rows = table.find_all("tr")
            for row in rows:
                cells = row.find_all("td")
                if len(cells) < 2:
                    continue
                
                # Colonne gauche = domicile
                left_cell = cells[0]
                left_text = left_cell.get_text(strip=True)
                
                # Colonne droite = extérieur
                right_cell = cells[-1]
                right_text = right_cell.get_text(strip=True)
                
                # Parser numéro + nom gauche
                if left_text and len(left_text) > 2:
                    m = re.match(r"^(\d{1,2})\s+(.+)$", left_text)
                    if m:
                        home_players.append({
                            "number": m.group(1),
                            "name": m.group(2).strip(),
                            "is_gk": "(G)" in left_text or "(GK)" in left_text
                        })
                
                # Parser nom + numéro droite
                if right_text and len(right_text) > 2 and right_text != left_text:
                    m = re.match(r"^(.+?)\s+(\d{1,2})$", right_text)
                    if m:
                        away_players.append({
                            "number": m.group(2),
                            "name": m.group(1).strip(),
                            "is_gk": "(G)" in right_text or "(GK)" in right_text
                        })
        
        if home_players or away_players:
            print(f"Lineups: {len(home_players)} domicile, {len(away_players)} extérieur")
            return {
                "home_players": home_players[:11],
                "away_players": away_players[:11]
            }
        
        return None
        
    except Exception as e:
        print(f"Erreur scrape_lineups: {e}")
        return None

def find_fixture_id(home, away, match_date):
    """Cherche le fixture_id dans Supabase depuis l'API football"""
    # Chercher dans les matchs déjà en cache
    try:
        # Normaliser les noms pour la comparaison
        home_norm = home.lower().replace(" ", "")
        away_norm = away.lower().replace(" " , "")
        
        # Vérifier si déjà dans algeria_lineups
        check = requests.get(
            f"{SB_URL}/rest/v1/algeria_lineups?match_date=eq.{match_date}&home_team=eq.{home}&away_team=eq.{away}",
            headers=SB_HEADERS
        ).json()
        
        if check and len(check) > 0 and check[0].get("fixture_id"):
            return check[0]["fixture_id"]
            
        return None
    except:
        return None

def save_lineups(fixture_id, mid, home, away, match_date, lineups):
    """Sauvegarde dans Supabase"""
    data = {
        "fixture_id": fixture_id or 0,
        "soccerway_mid": mid,
        "home_team": home,
        "away_team": away,
        "match_date": match_date,
        "home_players": lineups["home_players"],
        "away_players": lineups["away_players"],
        "scraped_at": datetime.now(timezone.utc).isoformat()
    }
    
    res = requests.post(
        f"{SB_URL}/rest/v1/algeria_lineups",
        headers=SB_HEADERS,
        json=data
    )
    print(f"Sauvegardé: {res.status_code} - {home} vs {away}")
    return res.status_code

# ── MAIN ──
print(f"=== Algeria Lineups Scraper {datetime.now().strftime('%H:%M:%S')} ===")

matches = get_today_fixtures()
print(f"Matchs trouvés aujourd'hui: {len(matches)}")

if not matches:
    print("Aucun match aujourd'hui")
    exit(0)

for match in matches:
    mid = match["mid"]
    home = match["home"]
    away = match["away"]
    match_date = match["date"]
    
    print(f"\n--- {home} vs {away} ---")
    
    # Vérifier si déjà scraped
    try:
        check = requests.get(
            f"{SB_URL}/rest/v1/algeria_lineups?soccerway_mid=eq.{mid}&select=id,home_players",
            headers=SB_HEADERS
        ).json()
        
        if check and len(check) > 0:
            players = check[0].get("home_players", [])
            if players and len(players) > 0:
                print(f"Déjà scraped avec {len(players)} joueurs")
                continue
    except:
        pass
    
    # Scraper les lineups
    lineups = scrape_lineups(mid)
    
    if lineups:
        fixture_id = find_fixture_id(home, away, match_date)
        save_lineups(fixture_id, mid, home, away, match_date, lineups)
    else:
        print(f"Lineups pas encore disponibles")

print("\n=== Terminé ===")
PYEOF