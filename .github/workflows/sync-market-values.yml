name: Sync Market Values (SofaScore)

on:
  schedule:
    - cron: '0 4 * * 1'   # Chaque lundi à 4h UTC
  workflow_dispatch:       # Déclenchement manuel possible

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Sync market values
        env:
          SUPABASE_URL: https://iqeqlsxjiklygywjirqs.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/sync_market_values.py