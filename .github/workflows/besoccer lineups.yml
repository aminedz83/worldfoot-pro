name: BeSoccer Lineups Scraper

on:
  schedule:
    - cron: '*/5 8-20 * * *'  # Toutes les 5 min entre 9h-21h Algérie
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -f scripts/besoccer_lineups.py ]; then
            python3 scripts/besoccer_lineups.py
          else
            python3 besoccer_lineups.py
          fi