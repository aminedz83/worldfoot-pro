name: Seed All Match IDs

on:
  workflow_dispatch:  # Manuel — à lancer une fois par saison (début août)

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # La saison entière peut prendre du temps
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cloudscraper

      - name: Run seed
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          API_FOOTBALL_KEY:  ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 seed_all_matches.py