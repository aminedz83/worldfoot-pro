name: Sync BeSoccer Transfers

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Saison (ex: 2026)'
        required: false
        default: '2026'
      mode:
        description: 'Mode: scrape (normal) ou debug (dump HTML)'
        required: false
        default: 'scrape'
        type: choice
        options:
          - scrape
          - debug

jobs:
  sync-transfers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4 requests

      - name: Run scraper (mode normal)
        if: ${{ github.event.inputs.mode != 'debug' }}
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRANSFER_SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python besoccer_transfers.py

      - name: Run debug (mode debug)
        if: ${{ github.event.inputs.mode == 'debug' }}
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python debug_transfers_html.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfers-${{ github.event.inputs.mode || 'scrape' }}-${{ github.run_number }}
          path: |
            transfers_debug.json
            transfers_html_debug.json
          retention-days: 7