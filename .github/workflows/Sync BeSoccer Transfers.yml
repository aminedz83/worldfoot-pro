name: Sync BeSoccer Transfers & Coaches

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Saison (ex: 2026). "all" pour 2024+2025+2026'
        required: false
        default: '2026'
      mode:
        description: 'Mode'
        required: false
        default: 'scrape'
        type: choice
        options:
          - scrape
          - scrape-coaches
          - debug
          - debug-coaches
          - debug-escudos
          - debug-matchids

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4 requests

      - name: Scrape transferts saison 2024
        if: ${{ github.event.inputs.mode == 'scrape' && github.event.inputs.season == 'all' }}
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRANSFER_SEASON: '2024'
        run: python3 besoccer_transfers.py

      - name: Scrape transferts saison 2025
        if: ${{ github.event.inputs.mode == 'scrape' && github.event.inputs.season == 'all' }}
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRANSFER_SEASON: '2025'
        run: python3 besoccer_transfers.py

      - name: Scrape transferts (saison normale ou cron)
        if: ${{ (github.event.inputs.mode == 'scrape' || github.event.inputs.mode == '') && github.event.inputs.season != 'all' }}
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRANSFER_SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python3 besoccer_transfers.py

      - name: Scrape coaches
        if: ${{ github.event.inputs.mode == 'scrape-coaches' || github.event.inputs.mode == '' }}
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 besoccer_coaches.py

      - name: Debug transferts
        if: ${{ github.event.inputs.mode == 'debug' }}
        run: python3 debug_transfers_html.py

      - name: Debug coaches
        if: ${{ github.event.inputs.mode == 'debug-coaches' }}
        run: python3 debug_coaches_html.py

      - name: Debug escudos
        if: ${{ github.event.inputs.mode == 'debug-escudos' }}
        run: python3 debug_escudos.py

      - name: Debug match IDs
        if: ${{ github.event.inputs.mode == 'debug-matchids' }}
        run: python3 debug_match_ids.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bs-${{ github.event.inputs.mode || 'cron' }}-${{ github.run_number }}
          path: |
            transfers_debug.json
            coaches_debug.json
            coaches_raw.html
          retention-days: 7