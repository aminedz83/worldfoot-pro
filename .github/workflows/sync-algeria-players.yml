name: Sync Algeria Players

on:
  schedule:
    - cron: '0 */6 * * *'  # Toutes les 6 heures
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser chromium-chromedriver
    
    - name: Install dependencies
      run: |
        pip install requests cloudscraper selenium webdriver-manager
    
    - name: Run sync script
      env:
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python3 sync-algeria-players.py