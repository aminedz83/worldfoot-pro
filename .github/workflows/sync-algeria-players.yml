name: Sync Algeria Players
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Run sync
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_KEY }}
        run: python3 sync-algeria-players.py