name: Algeria Rankings Scraper
on:
  schedule:
    - cron: '0 3 * * *'    # Quotidien 3h UTC (classement général)
    - cron: '0 18 * * *'   # Soir de match 18h UTC (après fin des matchs)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: current (saison en cours) ou all (toutes les saisons)'
        required: false
        default: 'current'
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests cloudscraper beautifulsoup4 tqdm
      - name: Run scraper (saison en cours)
        if: ${{ github.event.inputs.mode != 'all' }}
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/scrape_algeria_rankings.py
      - name: Run scraper (toutes les saisons)
        if: ${{ github.event.inputs.mode == 'all' }}
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/scrape_algeria_rankings.py --all