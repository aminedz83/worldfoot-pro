name: Backfill League Performance

on:
  workflow_dispatch:

jobs:
  backfill-lp:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backfill league_performance country
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PREDICTIONS_SUPA_URL: ${{ secrets.PREDICTIONS_SUPA_URL }}
          PREDICTIONS_SUPA_KEY: ${{ secrets.PREDICTIONS_SUPA_KEY }}
        run: |
          pip install supabase requests --quiet
          cat > bf.py <<'PY'
          import os
          import requests
          from supabase import create_client

          API_KEY  = os.environ.get("API_FOOTBALL_KEY", "").strip()
          SUPA_URL = os.environ.get("PREDICTIONS_SUPA_URL", "").strip()
          SUPA_KEY = os.environ.get("PREDICTIONS_SUPA_KEY", "").strip()
          HEADERS  = {"x-apisports-key": API_KEY}

          supabase = create_client(SUPA_URL, SUPA_KEY)


          def fetch_leagues():
              r = requests.get("https://v3.football.api-sports.io/leagues",
                               headers=HEADERS, params={"current": "true"}, timeout=30)
              r.raise_for_status()
              d = r.json()
              if d.get("errors"):
                  raise RuntimeError("Erreurs API : %s" % d["errors"])
              return d.get("response", [])


          def main():
              if not (API_KEY and SUPA_URL and SUPA_KEY):
                  print("ERREUR : secrets manquants.")
                  return

              raw = fetch_leagues()
              name2c = {}
              for it in raw:
                  nm = it.get("league", {}).get("name", "")
                  co = it.get("country", {}).get("name", "") or ""
                  if nm and co and nm not in name2c:
                      name2c[nm] = co
              print("Mapping API : %d noms de ligue" % len(name2c))

              nlp = 0
              for nm, co in name2c.items():
                  # Passe 1 : lignes au pays vide ("")
                  try:
                      res = supabase.table("league_performance").update({"league_country": co}) \
                          .eq("league_name", nm).eq("league_country", "").execute()
                      nlp += len(res.data or [])
                  except Exception as e:
                      print("  [empty %s] %s" % (nm, e))
                  # Passe 2 : lignes au pays NULL (au cas ou)
                  try:
                      res = supabase.table("league_performance").update({"league_country": co}) \
                          .eq("league_name", nm).is_("league_country", "null").execute()
                      nlp += len(res.data or [])
                  except Exception as e:
                      print("  [null %s] %s" % (nm, e))

              print("league_performance : %d lignes mises a jour" % nlp)
              print("")
              print("Termine. Recharge l'app : 'Taux par ligue' doit afficher les drapeaux.")


          if __name__ == "__main__":
              main()

          PY
          python bf.py