name: Competition Une Scraper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Run Apify scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests --quiet
          python3 - <<PYEOF
          import requests
          import os
          import time
          from datetime import datetime

          APIFY_TOKEN = os.environ["APIFY_TOKEN"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          SB_URL = "https://iqeqlsxjiklygywjirqs.supabase.co"
          SB_HEADERS = {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates"
          }
          KEYWORDS = ["la une", "competition du", "compétition du", "edition du", "une de"]

          # Lancer le run Apify
          resp = requests.post(
              f"https://api.apify.com/v2/acts/apify~facebook-posts-scraper/runs?token={APIFY_TOKEN}",
              json={
                  "startUrls": [{"url": "https://www.facebook.com/competitionalgerie"}],
                  "resultsLimit": 20
              }
          )
          print(f"Apify launch status: {resp.status_code}")
          run_data = resp.json()
          print(f"Apify response: {run_data}")

          # Vérifier que la réponse contient bien 'data'
          if "data" not in run_data:
              print(f"ERREUR: Réponse Apify invalide: {run_data}")
              exit(1)

          run_id = run_data["data"]["id"]
          print(f"Run ID: {run_id}")

          # Attendre la fin du run (max 4 minutes)
          for i in range(24):
              time.sleep(10)
              status_resp = requests.get(
                  f"https://api.apify.com/v2/actor-runs/{run_id}?token={APIFY_TOKEN}"
              ).json()
              status = status_resp.get("data", {}).get("status", "UNKNOWN")
              print(f"Status [{i+1}/24]: {status}")
              if status in ["SUCCEEDED", "FAILED", "ABORTED", "TIMED-OUT"]:
                  break

          if status != "SUCCEEDED":
              print(f"Run terminé avec status: {status}")
              exit(0)

          # Récupérer les items
          items = requests.get(
              f"https://api.apify.com/v2/actor-runs/{run_id}/dataset/items?token={APIFY_TOKEN}"
          ).json()
          print(f"Posts récupérés: {len(items)}")

          # Filtrer et sauvegarder
          for item in items:
              text = (item.get("text") or "").lower()
              if not any(k in text for k in KEYWORDS):
                  continue

              image = None
              if item.get("photo_image"):
                  image = item["photo_image"].get("uri")
              elif item.get("media") and len(item["media"]) > 0:
                  image = item["media"][0].get("thumbnail")

              if not image:
                  continue

              url = item.get("url") or item.get("postUrl") or ""
              published_at = item.get("time") or datetime.now().isoformat()

              res = requests.post(
                  f"{SB_URL}/rest/v1/competition_une",
                  headers=SB_HEADERS,
                  json={
                      "title": "La Une · Compétition",
                      "image_url": image,
                      "facebook_url": url,
                      "published_at": published_at
                  }
              )
              print(f"Sauvegardé: {res.status_code} - {image[:60]}")
              break

          print("Terminé.")
          PYEOF