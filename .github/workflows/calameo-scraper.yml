name: Competition Une Scraper
on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '0 23 * * *'
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Run Facebook scraper
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pip install requests cloudscraper beautifulsoup4 --quiet
          python3 - <<PYEOF
          import requests, os, re
          import cloudscraper
          from bs4 import BeautifulSoup
          from datetime import datetime

          SUPABASE_KEY = os.environ["SUPABASE_KEY"]
          SB_URL = "https://iqeqlsxjiklygywjirqs.supabase.co"
          SB_HEADERS = {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates"
          }
          KEYWORDS = ["la une", "competition du", "compétition du", "edition du", "une de"]

          scraper = cloudscraper.create_scraper(
              browser={"browser": "chrome", "platform": "windows", "mobile": False}
          )

          print("Chargement de la page Facebook...")
          r = scraper.get("https://mbasic.facebook.com/competitionalgerie", timeout=20)
          print(f"Status: {r.status_code} | HTML: {len(r.text)} chars")

          if r.status_code != 200:
              print(f"ERREUR: page inaccessible ({r.status_code})")
              exit(0)

          soup = BeautifulSoup(r.text, "html.parser")

          # Extraire tous les blocs de posts
          items = []
          for article in soup.select("div[data-ft]"):
              text_el = article.find("p") or article.find("div", {"data-ft": True})
              text = text_el.get_text(" ", strip=True) if text_el else ""
              img = article.find("img", src=re.compile(r"fbcdn|facebook"))
              image = img["src"] if img else None
              link = article.find("a", href=re.compile(r"/photo|/posts|/permalink"))
              url = ("https://facebook.com" + link["href"]) if link and link["href"].startswith("/") else ""
              items.append({"text": text, "image": image, "url": url, "time": datetime.now().isoformat()})

          print(f"Posts récupérés: {len(items)}")

          for item in items:
              text = (item.get("text") or "").lower()
              if not any(k in text for k in KEYWORDS):
                  continue
              image = item.get("image")
              if not image:
                  continue
              url = item.get("url") or ""
              published_at = item.get("time") or datetime.now().isoformat()
              res = requests.post(
                  f"{SB_URL}/rest/v1/competition_une",
                  headers=SB_HEADERS,
                  json={
                      "title": "La Une · Compétition",
                      "image_url": image,
                      "facebook_url": url,
                      "published_at": published_at
                  }
              )
              print(f"Sauvegardé: {res.status_code} - {image[:60]}")
              break

          print("Terminé.")
          PYEOF