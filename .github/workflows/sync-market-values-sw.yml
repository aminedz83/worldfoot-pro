name: Sync Market Values (Soccerway)

on:
  schedule:
    - cron: '0 3 * * 1'  # Chaque lundi à 3h UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper --quiet

      - name: Run scraper
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/sync_market_values_sw.py