    <script>
        if ("serviceWorker" in navigator) {
            const sw = `
    const C='wf-pro-v232';
    const API_KEY='3a14b1347c177458e2f23bea7899e9cf';
    const BASE='https://v3.football.api-sports.io';
    let prevScores = {};
    let checkInterval = null;

    self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./'])).then(()=>self.skipWaiting());});
    self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});

    // Vérifier les buts en arrière-plan
    async function checkGoals() {
      try {
        const db = await self.clients.matchAll();
        // Récupérer les favoris depuis le client si disponible
        let favIds = [];
        for (const client of db) {
          try {
            const mc = new MessageChannel();
            client.postMessage({ type: 'GET_FAVS' }, [mc.port2]);
            const favs = await new Promise((res, rej) => {
              mc.port1.onmessage = e => res(e.data);
              setTimeout(() => rej(), 1000);
            });
            if (favs && favs.length) { favIds = favs; break; }
          } catch {}
        }
        if (!favIds.length) {
          // Fallback: lire depuis indexedDB ou localStorage via le cache
          const stored = await caches.match('wf-favs');
          if (stored) favIds = await stored.json();
        }
        if (!favIds.length) return;

        // Charger les scores des matchs favoris live
        const today = new Date().toISOString().slice(0,10);
        const r = await fetch(\`\${BASE}/fixtures?date=\${today}&status=1H-2H-ET-P\`, {
          headers: { 'x-apisports-key': API_KEY }
        });
        const data = await r.json();
        const fixtures = (data.response || []).filter(f => favIds.includes(f.fixture.id));

        for (const f of fixtures) {
          const id = f.fixture.id;
          const hg = f.goals.home ?? 0;
          const ag = f.goals.away ?? 0;
          const key = id;
          const prev = prevScores[key];

          if (prev && (hg > prev.h || ag > prev.a)) {
            const scoringTeam = hg > prev.h ? f.teams.home : f.teams.away;
            await self.registration.showNotification(
              \`⚽ But ! \${f.teams.home.name} \${hg} - \${ag} \${f.teams.away.name}\`,
              {
                body: \`\${scoringTeam.name} vient de marquer !\`,
                icon: \`https://media.api-sports.io/football/teams/\${scoringTeam.id}.png\`,
                tag: \`goal-\${id}-\${hg}-\${ag}\`,
                vibrate: [200, 100, 200]
              }
            );
          }
          prevScores[key] = { h: hg, a: ag };
        }
      } catch(e) {}
    }

    // Démarrer/arrêter la surveillance selon les messages
    self.addEventListener('message', e => {
      if (e.data?.type === 'START_GOAL_CHECK') {
        if (!checkInterval) checkInterval = setInterval(checkGoals, 30000);
      }
      if (e.data?.type === 'STOP_GOAL_CHECK') {
        if (checkInterval) { clearInterval(checkInterval); checkInterval = null; }
      }
      if (e.data?.type === 'UPDATE_FAVS') {
        prevScores = {};
      }
    });

        /* ═══════════════════════════════════════════════════════

        ═══════════════════════════════════════════════════════ */

        :root {
            /* Surfaces */
            --c-base:        #F5F6F8;
            --c-surface:     #FFFFFF;
            --c-elevated:    #FFFFFF;
            --c-card:        #FFFFFF;
            --c-input:       #F8F9FB;

            /* Borders */
            --c-border:      rgba(15,23,42,0.07);
            --c-border-md:   rgba(15,23,42,0.11);
            --c-border-str:  rgba(15,23,42,0.16);

            /* Textes */
            --c-ink:         #0F1629;
            --c-ink-2:       rgba(15,22,41,0.60);
            --c-ink-3:       rgba(15,22,41,0.38);
            --c-ink-4:       rgba(15,22,41,0.22);

            /* Accent jade */
            --c-jade:        #059669;
            --c-jade-light:  #10B981;
            --c-jade-dim:    rgba(5,150,105,0.10);
            --c-jade-glow:   rgba(5,150,105,0.20);

            /* Live rouge */
            --c-live:        #E53E3E;
            --c-live-dim:    rgba(229,62,62,0.09);

            /* Or accent */
            --c-gold:        #B7791F;
            --c-gold-dim:    rgba(183,121,31,0.10);

            /* Typographies */
            --f-sans:  'Plus Jakarta Sans', -apple-system, sans-serif;
            --f-serif: 'Instrument Serif', Georgia, serif;
            --f-mono:  'JetBrains Mono', monospace;

            /* Ombres */
            --s-card:    0 1px 3px rgba(15,23,42,0.06), 0 4px 16px rgba(15,23,42,0.06);
            --s-card-md: 0 2px 8px rgba(15,23,42,0.08), 0 8px 24px rgba(15,23,42,0.06);
            --s-header:  0 1px 0 rgba(15,23,42,0.08), 0 4px 20px rgba(15,23,42,0.05);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; -webkit-text-size-adjust: 100%; }

        body {
            height: 100%;
            background: var(--c-base);
            font-family: var(--f-sans);
            color: var(--c-ink);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior: none;
            overflow: hidden;
            letter-spacing: -0.01em;
        }
        #root {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; }
        input, select, button { font-family: var(--f-sans); }
        select option { background: #fff; color: var(--c-ink); }
        *, button, a {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        .scroll-safe {
            padding-bottom: max(80px, calc(70px + env(safe-area-inset-bottom))) !important;
        }

        /* ── KEYFRAMES ── */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%,100% { opacity: 1; } 50% { opacity: 0.15; }
        }
        @keyframes pulseR {
            0%,100% { box-shadow: 0 0 0 0 rgba(229,62,62,0.4); }
            70%      { box-shadow: 0 0 0 7px rgba(229,62,62,0); }
        }
        @keyframes blink-3 {
            0%,33%,66%,100% { opacity: 1; }
            16%,49%,82%     { opacity: 0.2; }
        }
        @keyframes sk {
            0%,100% { opacity: 0.06; } 50% { opacity: 0.18; }
        }
        @keyframes up {
            from { transform: translateY(110%); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-6px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes gFlash {
            0%   { background: rgba(5,150,105,0.10); }
            100% { background: transparent; }
        }
        @keyframes sPop {
            0%   { color: var(--c-jade); transform: scale(1.4); }
            60%  { transform: scale(0.96); }
            100% { color: var(--c-ink); transform: scale(1); }
        }
        @keyframes lGlow {
            0%,100% { text-shadow: 0 0 6px rgba(5,150,105,0.5); }
            50%      { text-shadow: 0 0 16px rgba(5,150,105,0.8); }
        }
        @keyframes dotPulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50%     { transform: scale(1.5); opacity: 0.7; }
        }
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position:  200% 0; }
        }
        @keyframes rowIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes mdSlideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        @keyframes mdIn {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes mdBarGrow {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes stripeShift {
            0%   { background-position: 0% 0; }
            100% { background-position: 300% 0; }
        }

        /* ── UTILITAIRES ── */
        .bc { font-family: var(--f-mono); }

        .live-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--c-live);
            animation: dotPulse 1.4s ease-in-out infinite,

        }
        .row-anim  { animation: rowIn  0.28s cubic-bezier(0.22,1,0.36,1) forwards; }
        .score-pop { animation: sPop   0.5s  cubic-bezier(0.36,0.07,0.19,0.97) forwards; }
        .pop-in    { animation: popIn  0.28s cubic-bezier(0.22,1,0.36,1) forwards; }

        /* ── CARTES ── */
        .card {
            background: var(--c-card);
            border: 1px solid var(--c-border);
            border-radius: 18px;
            box-shadow: var(--s-card);
        }
        .card-hover { transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .card-hover:active {
            transform: scale(0.985);
            box-shadow: 0 1px 4px rgba(15,23,42,0.08);
        }
        .glass {
            background: rgba(255,255,255,0.88);
            border: 1px solid rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 20px;
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase;
        }
        .sep-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--c-border-md), transparent);
        }
        .btn-premium {
            background: linear-gradient(135deg, var(--c-jade) 0%, #047857 100%);
            border: none; border-radius: 14px;
            color: #fff; font-weight: 700;
            font-family: var(--f-sans);
            box-shadow: 0 4px 16px var(--c-jade-glow), 0 1px 0 rgba(255,255,255,0.15) inset;
            transition: all 0.2s ease; cursor: pointer;
        }
        .btn-premium:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px var(--c-jade-dim);
        }
        .input-premium {
            background: var(--c-input);
            border: 1.5px solid var(--c-border-md);
            border-radius: 12px; padding: 11px 14px;
            font-size: 14px; color: var(--c-ink); outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: var(--f-sans);
        }
        .input-premium:focus {
            border-color: var(--c-jade);
            box-shadow: 0 0 0 3px var(--c-jade-dim);
            background: #fff;

const TTL = {
  LIVE:15000, SCORES:60000, DONE:86400000, UPCOMING:21600000,
  STANDING:3600000, H2H:86400000, LINEUP:3600000, PLAYERS:3600000,
  INJURIES:3600000, TRANSFERS:86400000
};

async function api(path, ttl=TTL.SCORES, signal=null) {
  const now = Date.now();
  if(_cache.has(path) && now-_cache.get(path).t < ttl) return _cache.get(path).d;
  _trackApiCall();
  const r = await fetch(BASE+path, {headers:{"x-apisports-key":API_KEY}, signal});
  if(!r.ok) throw new Error(`Erreur HTTP ${r.status}`);
  const j = await r.json();
  if(j.errors && Object.keys(j.errors).length) {
    const msg = Object.values(j.errors)[0];
    throw new Error(typeof msg==="string"?msg:"Erreur API");
  }
  const d = j.response??[];
  const skipCache = d.length===0 && (path.includes("/lineups")||path.includes("/players"));
  if(!skipCache) _cache.set(path, {d, t:now});
  return d;
}

// ========== NOUVEAU TIMER UNIFIÉ COMME FLASHSCORE ==========
// Cache global par fixtureId : { wallTime, baseSeconds, maxSeen }
// Garantit que le temps ne recule JAMAIS, même entre mounts
const _timerCache = new Map();

function useMatchTimer(elapsed, status, fixtureDate, fixtureId) {
  const API_LAG = 45;
  const key = fixtureId || (status + "-" + (fixtureDate || ""));

  // Calculer le baseSeconds depuis elapsed API + compensation lag
  const rawBase = (elapsed || 0) * 60 + API_LAG;

  // Mettre à jour le cache seulement si on avance
  const existing = _timerCache.get(key);
  if (!existing) {
    _timerCache.set(key, { wallTime: Date.now(), baseSeconds: rawBase, maxSeen: elapsed || 0 });
  } else if ((elapsed || 0) > existing.maxSeen) {
    // L'API nous donne un elapsed plus grand → on avance l'ancre
    _timerCache.set(key, { wallTime: Date.now(), baseSeconds: rawBase, maxSeen: elapsed || 0 });
  }

  const anchor = _timerCache.get(key);

  // Temps initial = depuis l'ancre (jamais en arrière)
  const secondsSinceAnchor = Math.floor((Date.now() - anchor.wallTime) / 1000);
  let initTime = Math.floor((anchor.baseSeconds + secondsSinceAnchor) / 60);
  if (status === "1H" && initTime > 60) initTime = 60;
  if (status === "2H" && initTime > 105) initTime = 105;
  if (status === "ET" && initTime > 135) initTime = 135;

  const [currentTime, setCurrentTime] = useState(initTime);

  useEffect(() => {
    if (!LIVE_ST.has(status)) { setCurrentTime(elapsed || 0); return; }

    const anchorSnap = _timerCache.get(key);

    const updateTime = () => {
      const wallElapsed = Math.floor((Date.now() - anchorSnap.wallTime) / 1000);
      let newTime = Math.floor((anchorSnap.baseSeconds + wallElapsed) / 60);
      if (status === "1H" && newTime > 60) newTime = 60;
      if (status === "2H" && newTime > 105) newTime = 105;
      if (status === "ET" && newTime > 135) newTime = 135;
      // Mettre à jour le maxSeen global
      const cur = _timerCache.get(key);
      if (cur && newTime > cur.maxSeen) _timerCache.set(key, { ...cur, maxSeen: newTime });
      setCurrentTime(prev => Math.max(prev, newTime));
    };
    updateTime();
    const interval = setInterval(updateTime, 1000);
    return () => clearInterval(interval);
  }, [elapsed, status]);

  return currentTime;
}

function formatMatchTime(currentTime, status) {
  if (!LIVE_ST.has(status)) return null;
  if (status === "1H") {
    if (currentTime >= 45) { const extra = currentTime - 45; return `45+${extra}'`; }
    return `${currentTime}'`;
  }
  if (status === "2H") {
    if (currentTime >= 90) { const extra = currentTime - 90; return `90+${extra}'`; }
    return `${currentTime}'`;
  }
  if (status === "ET") {
    if (currentTime >= 90 && currentTime < 105) { const extra = currentTime - 90; return `90+${extra}' (P)`; }
    if (currentTime === 105) return `105' (Pause)`;
    if (currentTime >= 106 && currentTime < 120) { const extra = currentTime - 105; return `105+${extra}'`; }
    if (currentTime >= 120) { const extra = currentTime - 120; return `120+${extra}'`; }
    return `${currentTime}' (P)`;
  }
  if (status === "P") return "T.a.b";
  return `${currentTime}'`;
}

function useFlash(hg,ag){
  const prev=useRef({h:null,a:null}), [on,setOn]=useState(false);
  useEffect(()=>{
    const p=prev.current; prev.current={h:hg,a:ag};
    if(p.h!==null && (hg>p.h || ag>p.a)){ setOn(true); const t=setTimeout(()=>setOn(false),4000); return()=>clearTimeout(t); }
  },[hg,ag]);
  return on;
}

const _photoCache=new Map();
const PHOTO_SOURCES=[
  {name:"API-Sports-Proxy",  getUrl:(id)=>id?`https://corsproxy.io/?${encodeURIComponent(`https://media.api-sports.io/football/players/${id}.png`)}`:null},
  {name:"API-Sports-Direct", getUrl:(id)=>id?`https://media.api-sports.io/football/players/${id}.png`:null},
  {name:"TheSportsDB",       getUrl:async(_,name)=>{try{const r=await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${encodeURIComponent(name)}`);const d=await r.json();return d.player?.[0]?.strCutout||d.player?.[0]?.strThumb||null;}catch{return null;}}},
  {name:"ESPN",              getUrl:async(_,name)=>{try{const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/players?q=${encodeURIComponent(name)}`);const d=await r.json();return d.athletes?.[0]?.headshot?.href||null;}catch{return null;}}},
];

function checkImg(url){return new Promise(res=>{const i=new Image();i.onload=()=>res(true);i.onerror=()=>res(false);i.src=url;});}

async function resolvePlayerPhoto(playerId,playerName){
  const key=`pph_${playerId||""}_${playerName}`;
  if(_photoCache.has(key))return _photoCache.get(key);
  try{const lc=localStorage.getItem(key);if(lc){_photoCache.set(key,lc);return lc;}}catch(e){}
  for(const src of PHOTO_SOURCES){
    try{
      const url=await src.getUrl(playerId,playerName);
      if(!url)continue;
      const ok=await checkImg(url);
      if(ok){
        _photoCache.set(key,url);
        try{localStorage.setItem(key,url);}catch(e){}
        return url;
      }
    }catch(e){}
  }
  _photoCache.set(key,null);
  return null;
}

// Cache pour les photos d'entraîneurs
const _coachPhotoCache = new Map();

async function getCoachPhoto(coachName, coachId = null) {
  if (!coachName) return null;
  const cacheKey = `coach_${coachId || coachName.replace(/\s/g, '_')}`;
  if (_coachPhotoCache.has(cacheKey)) return _coachPhotoCache.get(cacheKey);
  const cleanName = coachName.split(',')[0].trim();

  // 1. URL directe API-Sports par ID (source principale — S. Ramović)
  if (coachId) {
    const url = `https://media.api-sports.io/football/coachs/${coachId}.png`;
    const ok = await checkImg(url);
    if (ok) { _coachPhotoCache.set(cacheKey, url); return url; }
  }

  // 2. TheSportsDB — bonne couverture mondiale
  try {
    const r = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${encodeURIComponent(cleanName)}`);
    const d = await r.json();
    if (d.player?.[0]) {
      const photo = d.player[0].strCutout || d.player[0].strThumb || d.player[0].strRender;
      if (photo) { _coachPhotoCache.set(cacheKey, photo); return photo; }
    }
  } catch(e) {}

  // 3. FotMob — bonne couverture entraîneurs
  try {
    const slug = cleanName.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    const fotmobUrls = [
      `https://images.fotmob.com/image_resources/playerimages/${coachId}.jpg`,
      `https://img.fotmob.com/image_resources/playerimages/${coachId}.jpg`,
    ];
    for (const url of fotmobUrls) {
      if (!coachId) break;
      const ok = await checkImg(url);
      if (ok) { _coachPhotoCache.set(cacheKey, url); return url; }
    }
  } catch(e) {}

  // 4. Transfermarkt — bonne couverture coaches africains/arabes
  try {
    const slug = cleanName.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    const tmUrls = [
      `https://img.a.transfermarkt.technology/portrait/header/${slug}.jpg`,
      `https://tmssl.akamaized.net/images/portrait/header/${coachId}_1.jpg`,
    ];
    for (const url of tmUrls) {
      const ok = await checkImg(url);
      if (ok) { _coachPhotoCache.set(cacheKey, url); return url; }
    }
  } catch(e) {}

  _coachPhotoCache.set(cacheKey, null);
  return null;
}

function getCoachInitials(name) {
  if (!name) return "?";
  const parts = name.trim().split(' ');
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  return name.substring(0, 2).toUpperCase();
}

// Composant photo entraîneur — valide l'image avant affichage
function CoachPhoto({ coach, size = 56, bgColor = "linear-gradient(135deg,#00c170,#009e5c)" }) {
  const [photoUrl, setPhotoUrl] = useState(null);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    if (!coach) return;
    let cancelled = false;

    const tryUrl = async (url) => {
      try {
        const res = await fetch(url, { method: "HEAD" });
        // API-Sports retourne 200 même pour images manquantes — vérifier Content-Type
        const ct = res.headers.get("content-type") || "";
        const cl = parseInt(res.headers.get("content-length") || "0");
        if (res.ok && ct.includes("image") && cl > 5000) return url;
      } catch {}
      return null;
    };

    (async () => {
      // Source 1 : photo de l'API déjà récupérée
      if (coach.photo && !coach.photo.includes("noimage") && !coach.photo.includes("default")) {
        if (!cancelled) { setPhotoUrl(coach.photo); return; }
      }

      // Source 2 : URL directe API-Sports validée
      const apiUrl = `https://media.api-sports.io/football/coachs/${coach.id}.png`;
      const valid = await tryUrl(apiUrl);
      if (!cancelled && valid) { setPhotoUrl(valid); return; }

      // Pas de photo valide
      if (!cancelled) setPhotoUrl(null);
    })();

    return () => { cancelled = true; };
  }, [coach?.id]);

  const initials = getCoachInitials(coach?.name);

  return React.createElement("div", {
    style: {
      width: size, height: size, borderRadius: "50%",
      overflow: "hidden", flexShrink: 0,
      background: photoUrl ? "#f1f5f9" : bgColor,
      display: "flex", alignItems: "center", justifyContent: "center"
    }
  },
    photoUrl
      ? React.createElement("img", {
          src: photoUrl,
          style: { width: "100%", height: "100%", objectFit: "cover" },
          onLoad: () => setLoaded(true),
          onError: () => setPhotoUrl(null)
        })
      : React.createElement("span", {
          style: { fontSize: size * 0.35, fontWeight: 800, color: "#fff", userSelect: "none" }
        }, initials)
  );
}

  });

const organizePlayersByLine = (players, formation) => {
  if (!players || players.length === 0) return [];

  const defaultFormation = [1, 4, 3, 3];

  let lines = [];
  if (formation) {
    const parts = formation.split("-").map(Number);
    lines = [1, ...parts];
  } else {
    lines = defaultFormation;
  }

  const result = [];
  let playerIndex = 0;

  for (let i = 0; i < lines.length; i++) {
    const lineSize = lines[i];
    const line = [];

    for (let j = 0; j < lineSize && playerIndex < players.length; j++) {
      line.push(players[playerIndex]);
      playerIndex++;
    }

    result.push(line);
  }

  if (playerIndex < players.length) {
    const subs = [];
    while (playerIndex < players.length) {
      subs.push(players[playerIndex]);
      playerIndex++;
    }
    result.push(subs);
  }

  return result;
};

    return swLast.length > 2 && api.includes(swLast);

      playerEvents = events.filter(e =>
        matchName(playerName, e.player?.name) ||
        matchName(playerName, e.assist?.name)
      );
    } else {
      return { goals:0, assists:0, yellow:0, red:0, isVar:false, sub:false };

function ComposPanel({lineups, players, homeTeam, awayTeam, isPartial, fix, events, injuries, onPlayerClick, algeriaLineups}) {
  const [view, setView] = useState("pitch");

  // Construire lineups depuis Supabase si match algérien
  var hLu = lineups?.find(l => l.team?.id === homeTeam?.id);
  var aLu = lineups?.find(l => l.team?.id === awayTeam?.id);

  if(algeriaLineups && (!hLu || !hLu.startXI || hLu.startXI.length===0)) {
    // Matcher un joueur Soccerway avec les données API football via le squad
    var matchWithSquad = function(swPlayer, squadPlayers) {
      if(!squadPlayers || !squadPlayers.length) return null;
      // Soccerway: "Merbah G." → nom de famille = premier mot
      var swFirst = (swPlayer.name||"").split(" ")[0].toLowerCase().replace(/[^a-z]/gi,"");
      if(swFirst.length < 3) return null;
      return squadPlayers.find(function(sp) {
        // API football: "G. Merbah" → nom de famille = dernier mot
        var spName = (sp.name||"").toLowerCase().replace(/[^a-z]/gi,"");
        var spParts = (sp.name||"").split(" ");
        var spLast = spParts[spParts.length-1].toLowerCase().replace(/[^a-z]/gi,"");
        return spLast.includes(swFirst) || swFirst.includes(spLast) || spName.includes(swFirst);
      }) || null;
    };

    // Convertir format Supabase → format API football avec vraies positions
    var buildLineup = function(starters, subs, team, squadPlayers) {
      // Déduire la formation depuis les positions
      var posCount = {D:0, M:0, F:0};
      starters.forEach(function(p) {
        var matched = matchWithSquad(p, squadPlayers);
        var pos = p.is_gk ? "G" : (matched ? matched.position : p.pos || "");
        if(posCount[pos] !== undefined) posCount[pos]++;
      });
      var formation = posCount.D + "-" + posCount.M + "-" + posCount.F;

      // Construire la grid pour le terrain
      var posLines = {G:[], D:[], M:[], F:[]};
      starters.forEach(function(p) {
        var matched = matchWithSquad(p, squadPlayers);
        var pos = p.is_gk ? "G" : (matched ? matched.position : (p.is_gk ? "G" : "M"));
        if(!posLines[pos]) pos = "M";
        posLines[pos].push(p);
      });

      // Assigner les grilles
      var gridAssign = function(players, line, total) {
        return players.map(function(p, i) {
          return line + ":" + (i+1);
        });
      };

      var lineMap = {G:1, D:2, M:3, F:4};
      var grids = {};
      ["G","D","M","F"].forEach(function(pos) {
        var ps = posLines[pos] || [];
        ps.forEach(function(p, i) {
          grids[p.name] = lineMap[pos] + ":" + (i+1);
        });
      });

      return {
        team: team,
        formation: formation,
        startXI: starters.map(function(p) {
          var matched = matchWithSquad(p, squadPlayers);
          var pos = p.is_gk ? "G" : (matched ? matched.position : "M");
          return {
            player: {
              id: matched ? matched.id : null,
              name: p.name,
              number: parseInt(p.number)||0,
              pos: pos,
              grid: grids[p.name] || null,
              photo: matched ? matched.photo : "https://media.api-sports.io/football/players/0.png"
            }
          };
        }),
        substitutes: (subs||[]).map(function(p) {
          var matched = matchWithSquad(p, squadPlayers);
          return {
            player: {
              id: matched ? matched.id : null,
              name: p.name,
              number: parseInt(p.number)||0,
              pos: p.is_gk ? "G" : (matched ? matched.position : "M"),
              grid: null,
              photo: matched ? matched.photo : "https://media.api-sports.io/football/players/0.png"
            }
          };
        })
      };
    };

    // Récupérer les squads des deux équipes pour matcher les positions
    var homeId = fix&&fix.teams&&fix.teams.home&&fix.teams.home.id;
    var awayId = fix&&fix.teams&&fix.teams.away&&fix.teams.away.id;

    var getSquad = function(teamId) {
      if(!teamId) return Promise.resolve([]);
      return api("/players/squads?team="+teamId, 86400000)
        .then(function(d){ return (d&&d[0]&&d[0].players)||[]; })
        .catch(function(){ return []; });
    };

    Promise.all([getSquad(homeId), getSquad(awayId)]).then(function(results) {
      var homeSquad = results[0];
      var awaySquad = results[1];

      if(algeriaLineups.home_players&&algeriaLineups.home_players.length>0) {
        hLu = buildLineup(algeriaLineups.home_players, algeriaLineups.home_subs||[], homeTeam, homeSquad);
      }
      if(algeriaLineups.away_players&&algeriaLineups.away_players.length>0) {
        aLu = buildLineup(algeriaLineups.away_players, algeriaLineups.away_subs||[], awayTeam, awaySquad);
      }
    });

    // En attendant le fetch, construire avec positions basiques
    if(algeriaLineups.home_players&&algeriaLineups.home_players.length>0) {
      hLu = buildLineup(algeriaLineups.home_players, algeriaLineups.home_subs||[], homeTeam, []);
    }
    if(algeriaLineups.away_players&&algeriaLineups.away_players.length>0) {
      aLu = buildLineup(algeriaLineups.away_players, algeriaLineups.away_subs||[], awayTeam, []);
    }
  }

  if (!hLu && !aLu) {
    return React.createElement("div", {
      style: {
        textAlign: "center",
        padding: "44px 20px",
        color: T.t3,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        gap: 12
      }
    },
      isPartial
        ? React.createElement(React.Fragment, null,
            React.createElement(Spin, { s: 24 }),
            React.createElement("span", { style: { fontSize: 13 } }, "Chargement compositions...")
          )
        : React.createElement(React.Fragment, null,
            React.createElement("div", { style: { fontSize: 36 } }, "📋"),
            React.createElement("div", { style: { fontSize: 13 } }, "Compositions non disponibles")
          )
    );
  }

  return React.createElement("div", { style: { width: "100%" } },
    React.createElement("div", {
      style: {
        display: "flex",
        gap: 6,
        marginBottom: 10,
        padding: "0 8px"
      }
    },
      React.createElement("button", {
        onClick: () => setView("pitch"),
        style: {
          flex: 1,
          padding: "8px 0",
          background: view === "pitch" ? "#00b86b" : "#f0f2f5",
          border: "none",
          borderRadius: 8,
          color: view === "pitch" ? "#fff" : "#666",
          fontSize: 12,
          fontWeight: view === "pitch" ? 700 : 500,
          cursor: "pointer"
        }
      }, "⚽ Terrain"),
      React.createElement("button", {
        onClick: () => setView("list"),
        style: {
          flex: 1,
          padding: "8px 0",
          background: view === "list" ? "#00b86b" : "#f0f2f5",
          border: "none",
          borderRadius: 8,
          color: view === "list" ? "#fff" : "#666",
          fontSize: 12,
          fontWeight: view === "list" ? 700 : 500,
          cursor: "pointer"
        }
      }, "📋 Liste")
    ),

    view === "pitch"
      ? renderTerrainFlash(
          fix || { teams: { home: homeTeam, away: awayTeam } },
          hLu,
          aLu,
          players || [],

          homeTeam?.id,
          awayTeam?.id,
          fix?.goals?.home !== undefined && fix?.goals?.away !== undefined,

        )

}

const refereeStatsCache = new Map();

const getRefereeStats = async (refereeName) => {
  if (!refereeName) return null;

  if (refereeStatsCache.has(refereeName)) {
    return refereeStatsCache.get(refereeName);
  }

  try {
    const cleanName = refereeName.split(',')[0].trim();

    let matches = await api(
      `/fixtures?referee=${encodeURIComponent(cleanName)}&last=10&status=FT`,
      86400000
    ).catch(() => []);

    if (!matches || matches.length === 0) {
      const fallbackMatches = await api(
        `/fixtures?referee=${encodeURIComponent(cleanName)}&last=5&status=FT`,
        86400000
      ).catch(() => []);

      if (!fallbackMatches || fallbackMatches.length === 0) {
        return null;
      }

      matches = fallbackMatches;
    }

    let totalY = 0, totalR = 0, count = 0;
    let countryCount = {};

    const limitedMatches = matches.slice(0, 8);

    for (const match of limitedMatches) {
      try {
        const events = await api(
          `/fixtures/events?fixture=${match.fixture.id}`,
          86400000
        ).catch(() => []);

        if (events && events.length) {
          const yellows = events.filter(e =>
            e.type === "Card" && e.detail === "Yellow Card"
          ).length;

          const reds = events.filter(e =>
            e.type === "Card" && (e.detail === "Red Card" || e.detail === "Second Yellow Card")
          ).length;

          totalY += yellows;
          totalR += reds;
          count++;
        }

        if (match.league?.country) {
          countryCount[match.league.country] = (countryCount[match.league.country] || 0) + 1;
        }

      } catch (e) {}
    }

    let countryCode = null;
    if (Object.keys(countryCount).length > 0) {
      const topCountry = Object.entries(countryCount)
        .sort((a, b) => b[1] - a[1])[0][0];

      const codeMap = {
        'Brazil': 'br', 'France': 'fr', 'England': 'gb', 'Spain': 'es',
        'Italy': 'it', 'Germany': 'de', 'Turkey': 'tr', 'Portugal': 'pt',
        'Netherlands': 'nl', 'Belgium': 'be', 'Switzerland': 'ch',
        'Algeria': 'dz', 'Morocco': 'ma', 'Tunisia': 'tn', 'Egypt': 'eg',
        'Argentina': 'ar', 'USA': 'us', 'Mexico': 'mx', 'Russia': 'ru',
        'Poland': 'pl', 'Sweden': 'se', 'Norway': 'no', 'Denmark': 'dk',
        'Greece': 'gr', 'Romania': 'ro', 'Serbia': 'rs', 'Croatia': 'hr',
        'Austria': 'at', 'Scotland': 'gb-sct', 'Ireland': 'ie', 'Israel': 'il',
        'Japan': 'jp', 'South Korea': 'kr', 'China': 'cn', 'Australia': 'au'
      };

      countryCode = codeMap[topCountry] || null;
    }

    const stats = {
      matches: count || Math.min(matches.length, 5),
      yellow: count > 0 ? (totalY / count).toFixed(2) : "0.00",
      red: count > 0 ? (totalR / count).toFixed(2) : "0.00",
      totalYellow: totalY,
      totalRed: totalR,
      countryCode
    };

    refereeStatsCache.set(refereeName, stats);
    return stats;

  } catch (error) {
    return null;
  }
};

function PlayerPage({ playerId, playerName, playerPhoto, playerPos, playerNumber, playerNationality, matchStats, onClose, knownTeamId, knownTeam, marketValueOverride, contractUntilOverride }) {
  const [tab, setTab] = React.useState("matchs");
  const [info, setInfo] = React.useState(
    knownTeam ? { _currentTeam: knownTeam } : null
  );
  const [career, setCareer] = React.useState([]);
  const [transfers, setTransfers] = React.useState([]);
  const [fixtures, setFixtures] = React.useState([]);
  const [fixtureStats, setFixtureStats] = React.useState({}); // {fixtureId: {rating, minutes, saves, onBench}}
  const [loading, setLoading] = React.useState(true);
  const curSeason = new Date().getMonth() >= 6 ? new Date().getFullYear() : new Date().getFullYear() - 1;

  React.useEffect(() => {
    if(!playerId) return;
    let cancelled = false;

    // ── AFFICHAGE INSTANTANÉ depuis le cache ──
    var shownFromCache = false;
    var DONE_S = ["FT","AET","PEN","AWD","WO"];
    function buildFixList(sources) {
      var seen = {}; var list = [];
      sources.forEach(function(arr){
        (arr||[]).forEach(function(f){
          var fid=f.fixture&&f.fixture.id;
          if(!fid||seen[fid]) return;
          if(DONE_S.includes(f.fixture.status&&f.fixture.status.short)){seen[fid]=true;list.push(f);}
        });
      });
      list.sort(function(a,b){return new Date(b.fixture.date)-new Date(a.fixture.date);});
      return list.slice(0,40);
    }
    // 1. D'abord essayer avec knownTeamId (disponible immédiatement depuis bottom sheet)
    if(knownTeamId) {
      var c1=_cache.get('/fixtures?team='+knownTeamId+'&season='+curSeason);
      var c2=_cache.get('/fixtures?team='+knownTeamId+'&season='+(curSeason-1));
      if(c1||c2){
        var q=buildFixList([c1&&c1.d||[],c2&&c2.d||[]]);
        if(q.length>0){setFixtures(q);shownFromCache=true;}
      }
    }
    // 2. Sinon chercher tout le cache fixtures
    if(!shownFromCache) {
      var cachedSources = [];
      _cache.forEach(function(v,k){
        if((k.includes('fixtures?player='+playerId)||k.includes('fixtures?team='))&&v&&v.d) cachedSources.push(v.d);
      });
      if(cachedSources.length>0){
        var quick=buildFixList(cachedSources);
        if(quick.length>0){setFixtures(quick);shownFromCache=true;}
      }
    }

    setLoading(!shownFromCache);
    if(!shownFromCache) setFixtures([]);
    setFixtureStats({});
    setInfo(null);
    setCareer([]);
    setTransfers([]);
    setMarketVal(null);

    // ── Chercher dans localStorage (cache persistant entre sessions) ──
    try {
      var lsKey = 'wf_fix_'+playerId;
      var lsData = localStorage.getItem(lsKey);
      if(lsData && !shownFromCache) {
        var parsed = JSON.parse(lsData);
        if(parsed && parsed.list && parsed.list.length>0 && Date.now()-parsed.ts < 3600000) {
          setFixtures(parsed.list);
          setLoading(false);
          shownFromCache = true;
        }
      }
    } catch(e) {}

    // ── ÉTAPE 1 : Fixtures via player endpoint
    Promise.allSettled([
      api(`/fixtures?player=${playerId}&season=${curSeason}`, 1800000),
      api(`/fixtures?player=${playerId}&season=${curSeason-1}`, 86400000),
    ]).then(fixResults => {
      if(cancelled) return;
      var allFix = buildFixList(fixResults.filter(function(r){return r.status==='fulfilled';}).map(function(r){return r.value||[];}));
      if(!cancelled&&allFix.length>0) {
        setFixtures(allFix);
        setLoading(false);
        // Sauvegarder dans localStorage pour prochaine ouverture instantanée
        try { localStorage.setItem('wf_fix_'+playerId, JSON.stringify({list:allFix,ts:Date.now()})); } catch(e){}
      }
    }).catch(function(){});

    // ── ÉTAPE 2 : Squad pour club (skip si knownTeamId déjà fourni)
    const squadPromise = knownTeamId
      ? Promise.resolve([{ team: knownTeam || { id: knownTeamId } }])
      : api(`/players/squads?player=${playerId}`, 21600000);

    squadPromise.then(squadData => {
      if(cancelled) return;
      const currentTeam = squadData?.[0]?.team;
      const currentTeamId = currentTeam?.id || knownTeamId;

      if(currentTeam && currentTeam.name) {
        setInfo(prev => prev ? {...prev, _currentTeam: currentTeam} : {_currentTeam: currentTeam});
      }

      if(currentTeamId) {
        api(`/players/squads?team=${currentTeamId}`, 86400000).then(sq => {
          if(cancelled) return;
          const found = (sq?.[0]?.players||[]).find(p => p.id === playerId);
          if(found?.contract) {
            setInfo(prev => prev ? {...prev, _contract: found.contract, _currentTeam: currentTeam} : {_contract: found.contract, _currentTeam: currentTeam});
          }
        }).catch(()=>{});

        // Matchs club en complément
        Promise.allSettled([
          api(`/fixtures?team=${currentTeamId}&season=${curSeason}`, 1800000),
          api(`/fixtures?team=${currentTeamId}&season=${curSeason-1}`, 86400000),
        ]).then(fixResults => {
          if(cancelled) return;
          const seen = {};
          const allFix = [];
          var allSources = [];
          for(var ri=0;ri<fixResults.length;ri++){
            var rv = fixResults[ri];
            if(rv.status==='fulfilled'&&rv.value) allSources.push(rv.value);
          }
          // Aussi inclure les fixtures déjà chargées via player
          var cachedP1 = _cache.get('/fixtures?player='+playerId+'&season='+curSeason);
          var cachedP2 = _cache.get('/fixtures?player='+playerId+'&season='+(curSeason-1));
          if(cachedP1&&cachedP1.d) allSources.push(cachedP1.d);
          if(cachedP2&&cachedP2.d) allSources.push(cachedP2.d);
          for(var si=0;si<allSources.length;si++){
            var src = allSources[si];
            for(var fi=0;fi<src.length;fi++){
              var f = src[fi];
              var fid = f.fixture && f.fixture.id;
              if(!fid||seen[fid]) continue;
              if(["FT","AET","PEN","AWD","WO"].includes(f.fixture.status && f.fixture.status.short)){
                seen[fid]=true;
                allFix.push(f);
              }
            }

          allFix.sort(function(a,b){return new Date(b.fixture.date)-new Date(a.fixture.date);});
          var limited = allFix.slice(0,40);

          const loadMatchStats = function(fixList) {

            var runBatch = function() {
              if(cancelled) return;
              var start = batchIndex * BATCH;

              Promise.allSettled(batch.map(function(fix) {

                  api('/fixtures/players?fixture=' + fid, 86400000).catch(function(){return [];}),

    if(targetLid === 1 && WC_BRACKETS[Number(season)]) {
      setAllFixtures(WC_BRACKETS[Number(season)]);
      setFixtures(WC_BRACKETS[Number(season)]);
      setLoading(false);

    setLoading(true);

    setFixtures([]);
    const koRounds = ["Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"];
    Promise.allSettled(
      koRounds.map(r =>
        api(`/fixtures?league=${targetLid}&season=${season}&round=${encodeURIComponent(r)}`, 3600000)
          .catch(() => [])

      const all = results.flatMap(r => r.status === "fulfilled" ? (r.value||[]) : []);
      if(all.length) {

        setFixtures(all);

                  const phaseOrder  = ["Round of 32","Round of 16","Quarter-finals","Semi-finals","Final"];
                  const phaseLabels = {"Round of 32":"1/16","Round of 16":"1/8","Quarter-finals":"Quarts","Semi-finals":"Demis","Final":"Finale"};
                  const byPhase = {};
                  phaseOrder.forEach(p => { byPhase[p] = []; });
                  fixtures.forEach(f => { const ph = getPhaseKey(f.league?.round||""); if(ph) byPhase[ph].push(f); });
                  const pairsByPhase = {};

                    [...matches].sort((a,b)=>new Date(a.fixture.date)-new Date(b.fixture.date)).forEach(f => {
                      if(seen.has(f.fixture.id)) return;
                      pairs.push({leg1:f, leg2:null});

                    });
                    pairsByPhase[ph] = pairs;
                  });

                  if(!availablePhases.length) return null;

                  // Layout bracket identique au bracket live
                  const CARD_W=172, CARD_H=70, COL_GAP=40, HEADER_H=36, TOP_PAD=12;
                  const nCols = availablePhases.length;
                  const maxPairs = pairsByPhase[availablePhases[0]].length;
                  const getSlotH = ci => (CARD_H+16)*Math.pow(2,ci);
                  const totalH = getSlotH(0)*maxPairs;
                  const getCardY = (ci,si) => si*getSlotH(ci)+(getSlotH(ci)-CARD_H)/2;
                  const totalW = nCols*CARD_W+(nCols-1)*COL_GAP+1;
                  const shortN = n => !n?"?":n.length>13?n.split(" ").slice(-1)[0]:n;

                  return React.createElement("div",{style:{overflowX:"auto",overflowY:"hidden",paddingBottom:16,WebkitOverflowScrolling:"touch"}},
                    React.createElement("div",{style:{position:"relative",width:totalW,height:totalH+HEADER_H+TOP_PAD}},

                          if(ci===nCols-1) return null;
                          const pairs = pairsByPhase[ph];
                          return pairs.map((_,pi) => {
                            const y    = HEADER_H+TOP_PAD+getCardY(ci,pi)+CARD_H/2;
                            const x1   = ci*(CARD_W+COL_GAP)+CARD_W;
                            const x2   = (ci+1)*(CARD_W+COL_GAP);
                            const xMid = x1+COL_GAP/2;
                            const si2  = Math.floor(pi/2);
                            const yNext= HEADER_H+TOP_PAD+getCardY(ci+1,si2)+CARD_H/2;
                            const isTop = pi%2===0;
                            const hasSib = (isTop ? pi+1 : pi-1) < pairs.length;
                            if(hasSib) {
                              const sibY = HEADER_H+TOP_PAD+getCardY(ci,isTop?pi+1:pi-1)+CARD_H/2;
                              const yMid = (y+sibY)/2;
                              return React.createElement("g",{key:`c${ph}${pi}`},
                                React.createElement("line",{x1,y1:y,x2:xMid,y2:y,stroke:"#dde3ed",strokeWidth:1.5}),
                                React.createElement("line",{x1:xMid,y1:y,x2:xMid,y2:yMid,stroke:"#dde3ed",strokeWidth:1.5}),
                                isTop && React.createElement("line",{x1:xMid,y1:yMid,x2:x2,y2:yMid,stroke:"#dde3ed",strokeWidth:1.5}),
                                React.createElement("circle",{cx:xMid,cy:y,r:2.5,fill:"#dde3ed"})
                              );
                            }
                            return React.createElement("g",{key:`c${ph}${pi}`},
                              React.createElement("line",{x1,y1:y,x2:xMid,y2:y,stroke:"#dde3ed",strokeWidth:1.5}),
                              React.createElement("line",{x1:xMid,y1:y,x2:xMid,y2:yNext,stroke:"#dde3ed",strokeWidth:1.5}),
                              React.createElement("line",{x1:xMid,y1:yNext,x2:x2,y2:yNext,stroke:"#dde3ed",strokeWidth:1.5})
                            );
                          });
                        })
                      ),
                      // Headers
                      availablePhases.map((ph,ci) =>
                        React.createElement("div",{key:`h${ph}`,style:{
                          position:"absolute",left:ci*(CARD_W+COL_GAP),top:TOP_PAD,width:CARD_W,
                          textAlign:"center",fontSize:10,fontWeight:800,color:"#059669",
                          textTransform:"uppercase",letterSpacing:1.2,paddingBottom:8,borderBottom:"2px solid #e2faf1"
                        }},phaseLabels[ph])
                      ),
                      // Cartes
                      availablePhases.map((ph,ci) =>
                        pairsByPhase[ph].map((pair,pi) => {
                          const f = pair.leg1;
                          if(!f) return null;
                          const hWin = f.goals.home > f.goals.away;
                          const aWin = f.goals.away > f.goals.home;
                          const cardTop  = getCardY(ci,pi);
                          const cardLeft = ci*(CARD_W+COL_GAP);
                          const teamRow = (team,score,wins,isBot) =>
                            React.createElement("div",{style:{
                              display:"flex",alignItems:"center",gap:6,padding:"0 10px",height:CARD_H/2,
                              background:wins?"linear-gradient(90deg,#f0fdf4,#fff)":"#fff",
                              borderTop:isBot?"1px solid #f0f2f6":"none"
                            }},
                              React.createElement("img",{src:team?.logo,style:{width:17,height:17,objectFit:"contain",flexShrink:0},onError:e=>e.target.style.display="none"}),
                              React.createElement("span",{style:{fontSize:11.5,flex:1,fontWeight:wins?700:400,color:wins?"#0f172a":"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},shortN(team?.name)),
                              React.createElement("span",{style:{fontSize:13,fontWeight:wins?800:500,color:wins?"#0f172a":"#94a3b8",minWidth:18,textAlign:"right",fontVariantNumeric:"tabular-nums"}},score)
                            );
                          return React.createElement("div",{
                            key:`k${ph}${pi}`,
                            style:{position:"absolute",left:cardLeft,top:HEADER_H+TOP_PAD+cardTop,width:CARD_W,height:CARD_H,
                              borderRadius:10,overflow:"hidden",
                              boxShadow:"0 1px 6px rgba(0,0,0,.08), 0 0 0 1px #f0f2f6",
                              background:"#fff"}
                          },
                            teamRow(f.teams.home,f.goals.home,hWin,false),
                            teamRow(f.teams.away,f.goals.away,aWin,true)
                          );
                        })
                      )
                    )
                  );
                })()
              )
            )
          );
        })()
      )
    ) : null
  );
}

function MatchDetail({state,onClose,onTeam}){
  const[tab,setTab]=React.useState("resume");
  const[period,setPeriod]=React.useState("all");
  const[playerSheet,setPlayerSheet]=React.useState(null);
  const[playerSheetLoading,setPlayerSheetLoading]=React.useState(false);
  const[playerPage,setPlayerPage]=React.useState(null);
  const[standings,setStandings]=React.useState([]);
  const[roundStandings,setRoundStandings]=React.useState(null);
  const[venueInfo,setVenueInfo]=React.useState(null);
  const[teamStats,setTeamStats]=React.useState({h:null,a:null});

  const[firstLegScore,setFirstLegScore]=React.useState(null);
  const[showLeagueSheet,setShowLeagueSheet]=React.useState(false);
  const[leagueInfo,setLeagueInfo]=React.useState(null);
  const[algeriaLineups,setAlgeriaLineups]=React.useState(null);
  const contentRef=React.useRef(null);

  const [refereeStats, setRefereeStats] = useState(null);
  const [refereeCountry, setRefereeCountry] = useState(null);
  const [refereeLoading, setRefereeLoading] = useState(false);
  const [refereeError, setRefereeError] = useState(false);

  const fix     = state?.data?.fixture ?? null;
  const stats   = state?.data?.stats ?? [];
  const events  = state?.data?.events ?? [];
  const lineups = state?.data?.lineups ?? [];
  const h2h     = state?.data?.h2h ?? [];
  const players = state?.data?.players ?? [];
  const injuries= state?.data?.injuries ?? [];

  const s  = fix?.fixture?.status ?? {short:"NS",elapsed:null};
  const sh = s.short;
  const hg = fix?.goals?.home ?? null;
  const ag = fix?.goals?.away ?? null;
  const has = hg!=null && ag!=null;
  const isLive = ["1H","2H","ET","P"].includes(sh);
  const isDone = ["FT","AET","PEN"].includes(sh);
  const isNS = ["NS","TBD","PST","CANC"].includes(sh);

  const liveTime = useMatchTimer(s.elapsed, sh, fix?.fixture?.date, fix?.fixture?.id);
  const timeDisplay = isLive ? formatMatchTime(liveTime, sh) : null;

  // Classement général
  React.useEffect(()=>{
    if(!fix)return;
    const lid=fix.league?.id,season=fix.league?.season;
    if(!lid||!season)return;
    const stTTL=isLive?60000:isDone?10800000:3600000;
    let stCancelled=false;
    const fetchSt=()=>api(`/standings?league=${lid}&season=${season}`,stTTL)
      .then(d=>{if(!stCancelled)setStandings(d);})
      .catch(()=>{});
    fetchSt();
    const stIv=isLive?setInterval(fetchSt,60000):null;
    return()=>{stCancelled=true;if(stIv)clearInterval(stIv);};
  },[fix?.fixture?.id,isLive]);

  // CLASSEMENT APRÈS CETTE JOURNÉE SPÉCIFIQUE - VERSION CORRIGÉE
  React.useEffect(() => {
    if (!fix || !fix.league?.round) return;
    
    let cancelled = false;
    const round = fix.league.round;
    const lid = fix.league.id;
    const season = fix.league.season;
    
    const fetchRoundStandings = async () => {
      try {
        // 1. Récupérer la liste de TOUS les rounds de la saison dans l'ordre
        const roundsList = await api(`/fixtures/rounds?league=${lid}&season=${season}`, 3600000);
        
        if (!roundsList || roundsList.length === 0 || cancelled) return;
        
        // 2. Trouver l'index du round actuel (celui du match)
        const roundIndex = roundsList.findIndex(r => r === round);
        if (roundIndex === -1 || cancelled) return;
        
        console.log(`Chargement classement après ${round} (journée ${roundIndex + 1})`);
        
        // 3. Récupérer TOUS les matchs de la saison
        const allMatches = [];
        
        // Option 1: Récupérer tous les matchs de la saison en une seule requête (plus fiable)
        try {
          const seasonMatches = await api(`/fixtures?league=${lid}&season=${season}`, 3600000);
          if (seasonMatches && seasonMatches.length > 0) {
            // Filtrer pour ne garder que les matchs terminés
            const finishedMatches = seasonMatches.filter(m => DONE_ST.has(m.fixture.status.short));
            
            // Ne garder que les matchs jusqu'au round actuel inclus
            for (const match of finishedMatches) {
              // Trouver le round de ce match
              const matchRound = match.league?.round;
              if (matchRound) {
                const matchRoundIndex = roundsList.findIndex(r => r === matchRound);
                if (matchRoundIndex !== -1 && matchRoundIndex <= roundIndex) {
                  allMatches.push(match);
                }
              }
            }
          }
        } catch (e) {
          console.log("Erreur chargement tous les matchs", e);
          
          // Option 2: Fallback - charger round par round
          for (let i = 0; i <= roundIndex; i++) {
            const currentRound = roundsList[i];
            try {
              const roundMatches = await api(`/fixtures?league=${lid}&season=${season}&round=${encodeURIComponent(currentRound)}`, 3600000);
              
              if (roundMatches && roundMatches.length > 0) {
                // Ne prendre que les matchs terminés
                const finishedMatches = roundMatches.filter(m => DONE_ST.has(m.fixture.status.short));
                allMatches.push(...finishedMatches);
              }
            } catch (e) {
              console.log(`Erreur chargement round ${currentRound}`, e);
            }
          }
        }
        
        console.log(`${allMatches.length} matchs trouvés jusqu'à la J${roundIndex + 1}`);
        
        if (allMatches.length === 0 || cancelled) return;
        
        // 4. Récupérer la liste de toutes les équipes de la ligue
        const fullStandings = await api(`/standings?league=${lid}&season=${season}`, 3600000);
        if (!fullStandings || fullStandings.length === 0 || cancelled) return;
        
        const standingsData = fullStandings[0]?.league?.standings?.[0] || [];
        if (standingsData.length === 0 || cancelled) return;
        
        // 5. Initialiser chaque équipe avec ZÉRO partout
        const roundStandingsData = standingsData.map(team => ({
          ...team,
          all: { 
            played: 0, win: 0, draw: 0, lose: 0,
            goals: { for: 0, against: 0 }
          },
          home: { played: 0, win: 0, draw: 0, lose: 0, goals: { for: 0, against: 0 } },
          away: { played: 0, win: 0, draw: 0, lose: 0, goals: { for: 0, against: 0 } },
          points: 0,
          form: "",
          description: team.description,
          rank: 0
        }));
        
        // 6. Calculer les stats pour chaque équipe à partir de TOUS les matchs joués jusqu'à maintenant
        for (const match of allMatches) {
          const homeId = match.teams.home.id;
          const awayId = match.teams.away.id;
          const homeGoals = match.goals.home || 0;
          const awayGoals = match.goals.away || 0;
          
          const homeTeam = roundStandingsData.find(t => t.team.id === homeId);
          const awayTeam = roundStandingsData.find(t => t.team.id === awayId);
          
          if (homeTeam) {
            // Mise à jour stats domicile
            homeTeam.home.played++;
            homeTeam.home.goals.for += homeGoals;
            homeTeam.home.goals.against += awayGoals;
            
            // Mise à jour stats générales
            homeTeam.all.played++;
            homeTeam.all.goals.for += homeGoals;
            homeTeam.all.goals.against += awayGoals;
            
            if (homeGoals > awayGoals) {
              homeTeam.home.win++;
              homeTeam.all.win++;
              homeTeam.points += 3;
            } else if (homeGoals === awayGoals) {
              homeTeam.home.draw++;
              homeTeam.all.draw++;
              homeTeam.points += 1;
            } else {
              homeTeam.home.lose++;
              homeTeam.all.lose++;
            }
          }
          
          if (awayTeam) {
            // Mise à jour stats extérieur
            awayTeam.away.played++;
            awayTeam.away.goals.for += awayGoals;
            awayTeam.away.goals.against += homeGoals;
            
            // Mise à jour stats générales
            awayTeam.all.played++;
            awayTeam.all.goals.for += awayGoals;
            awayTeam.all.goals.against += homeGoals;
            
            if (awayGoals > homeGoals) {
              awayTeam.away.win++;
              awayTeam.all.win++;
              awayTeam.points += 3;
            } else if (awayGoals === homeGoals) {
              awayTeam.away.draw++;
              awayTeam.all.draw++;
              awayTeam.points += 1;
            } else {
              awayTeam.away.lose++;
              awayTeam.all.lose++;
            }
          }
        }
        
        // 7. Trier par points (et critères de départage)
        roundStandingsData.sort((a, b) => {
          if (a.points !== b.points) return b.points - a.points;
          const gdA = (a.all.goals.for - a.all.goals.against);
          const gdB = (b.all.goals.for - b.all.goals.against);
          if (gdA !== gdB) return gdB - gdA;
          return (b.all.goals.for || 0) - (a.all.goals.for || 0);
        });
        
        // 8. Mettre à jour les rangs
        roundStandingsData.forEach((team, idx) => {
          team.rank = idx + 1;
        });
        
        // 9. Calculer la forme (les 5 derniers matchs)
        const last5Matches = [...allMatches]
          .sort((a, b) => new Date(b.fixture.date) - new Date(a.fixture.date))
          .slice(0, 5);
        
        roundStandingsData.forEach(team => {
          const teamLast5 = last5Matches
            .filter(m => m.teams.home.id === team.team.id || m.teams.away.id === team.team.id)
            .map(m => {
              const isHome = m.teams.home.id === team.team.id;
              const gF = isHome ? m.goals.home : m.goals.away;
              const gA = isHome ? m.goals.away : m.goals.home;
              if (gF > gA) return "W";
              if (gF < gA) return "L";
              return "D";
            })
            .join('');
          
          team.form = teamLast5 || "";
        });
        
        if (!cancelled) {
          setRoundStandings({
            league: fullStandings[0].league,
            standings: [roundStandingsData]
          });
          
          // Afficher les stats pour vérification
          console.log(`=== CLASSEMENT APRÈS J${roundIndex + 1} ===`);
          roundStandingsData.slice(0, 5).forEach(t => {
            console.log(`${t.rank}. ${t.team.name} - ${t.points} pts (${t.all.played} MJ)`);
          });
        }
      } catch (e) {
        console.log("Erreur chargement classement journée", e);
      }
    };
    
    fetchRoundStandings();
    
    return () => { cancelled = true; };
  }, [fix?.fixture?.id]);

  React.useEffect(()=>{
    if(!showLeagueSheet||!fix?.league?.id||leagueInfo)return;
    api(`/leagues?id=${fix.league.id}`,86400000)
      .then(d=>{if(d&&d[0])setLeagueInfo(d[0]);})
      .catch(()=>{});
  },[showLeagueSheet]);

  // Fetch lineups algériennes depuis Supabase pour league 186
  React.useEffect(function(){
    if(tab!=="compos") return;
    if(!fix||!fix.league||fix.league.id!==186) return;
    var homeTeam = fix.teams&&fix.teams.home&&fix.teams.home.name;
    var awayTeam = fix.teams&&fix.teams.away&&fix.teams.away.name;
    var matchDate = fix.fixture&&fix.fixture.date&&fix.fixture.date.slice(0,10);
    var fixtureId = fix.fixture&&fix.fixture.id;
    if(!homeTeam||!awayTeam||!matchDate) return;
    console.log("Algeria lineups fetch:", homeTeam, "vs", awayTeam, matchDate, "fid:", fixtureId);
    var SB = 'https://iqeqlsxjiklygywjirqs.supabase.co/rest/v1/algeria_lineups';
    var H = { 'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY };
    var tryFetch = function(url) {
      return fetch(url, { headers: H }).then(function(r){ return r.json(); });
    };
    // Essayer 1: par fixture_id
    // Essayer 2: par nom équipe + date
    // Essayer 3: par date seule (pour trouver le bon match)

function StandingsTab({ onTeam }) {
  const [viewMode, setViewMode] = useState("classement");
  const [lid, setLid] = useState(39);
  const [season, setSeason] = useState(CUR_SEASON);
  const [standings, setStandings] = useState([]);
  const [rounds, setRounds] = useState([]);
  const [selectedRound, setSelectedRound] = useState("");
  const [roundStandings, setRoundStandings] = useState(null);
  const [matches, setMatches] = useState([]);
  const [status, setStatus] = useState("load");
  const [detailMatch, setDetailMatch] = useState(null);
  const [teamLeagues, setTeamLeagues] = useState([]); // [{id, name, logo, season}]
  const [selLeagueId, setSelLeagueId] = useState(null);
  const [selSeason, setSelSeason] = useState(null);
  const [standingsFiltered, setStandingsFiltered] = useState([]);
  const [loadingStand, setLoadingStand] = useState(false);
  const [showConfig, setShowConfig] = useState(false);
  const [loadingRound, setLoadingRound] = useState(false);

  const league = LEAGUES.find(l => l.id === lid) || LEAGUES[0];
  const [leagueLogo, setLeagueLogo] = useState(null);

  useEffect(() => {
    if (standings?.length > 0) {
      const logo = standings[0]?.league?.logo;
      if (logo) setLeagueLogo(logo);
    }
  }, [standings]);

  // Charger le classement général
  useEffect(() => {
    if (viewMode !== "classement") return;
    let mounted = true;
    setStatus("load");
    api(`/standings?league=${lid}&season=${season}`, 3600000)
      .then(data => { if (mounted) { setStandings(data || []); setStatus(data?.length ? "ok" : "empty"); } })
      .catch(() => { if (mounted) setStatus("err"); });
    return () => { mounted = false; };
  }, [lid, season, viewMode]);

  // Charger la liste des journées
  useEffect(() => {
    if (viewMode !== "resultats" && viewMode !== "classement-journee") return;
    let mounted = true;
    setStatus("load");
    api(`/fixtures/rounds?league=${lid}&season=${season}`, 3600000)
      .then(res => {
        if (mounted) {
          setRounds(res || []);
          if (res && res.length > 0) {
            const mid = Math.floor(res.length / 2);
            setSelectedRound(res[mid]);
          }
        }
      });
    return () => { mounted = false; };
  }, [lid, season, viewMode]);

  // Charger les matchs d'une journée spécifique
  useEffect(() => {
    if (!selectedRound || viewMode !== "resultats") return;
    let mounted = true;
    api(`/fixtures?league=${lid}&season=${season}&round=${encodeURIComponent(selectedRound)}`, 3600000)
      .then(res => { if (mounted) setMatches(res || []); })
      .catch(() => {});
    return () => { mounted = false; };
  }, [selectedRound, lid, season, viewMode]);

  // Calculer le classement après une journée spécifique
  const loadRoundStandings = async (roundName) => {
    if (!roundName) return;
    
    setLoadingRound(true);
    setRoundStandings(null);
    
    try {
      const roundIndex = rounds.findIndex(r => r === roundName);
      if (roundIndex === -1) return;
      
      console.log(`📊 Calcul du classement après ${roundName} (journée ${roundIndex + 1})`);
      
      const allSeasonMatches = await api(`/fixtures?league=${lid}&season=${season}`, 3600000);
      if (!allSeasonMatches || allSeasonMatches.length === 0) return;
      
      const fullStandings = await api(`/standings?league=${lid}&season=${season}`, 3600000);
      if (!fullStandings || fullStandings.length === 0) return;
      
      const standingsData = fullStandings[0]?.league?.standings?.[0] || [];
      if (standingsData.length === 0) return;
      
      const roundStandingsData = standingsData.map(team => ({
        ...team,
        all: { 
          played: 0, win: 0, draw: 0, lose: 0,
          goals: { for: 0, against: 0 }
        },
        home: { played: 0, win: 0, draw: 0, lose: 0, goals: { for: 0, against: 0 } },
        away: { played: 0, win: 0, draw: 0, lose: 0, goals: { for: 0, against: 0 } },
        points: 0,
        form: "",
        description: team.description,
        rank: 0
      }));
      
      const matchesUpToRound = [];
      
      for (let i = 0; i <= roundIndex; i++) {
        const currentRound = rounds[i];
        try {
          const roundMatches = await api(`/fixtures?league=${lid}&season=${season}&round=${encodeURIComponent(currentRound)}`, 3600000);
          
          if (roundMatches && roundMatches.length > 0) {
            const finishedMatches = roundMatches.filter(m => DONE_ST.has(m.fixture.status.short));
            matchesUpToRound.push(...finishedMatches);
          }
        } catch (e) {
          console.log(`Erreur chargement round ${currentRound}`, e);
        }
      }
      
      console.log(`${matchesUpToRound.length} matchs trouvés jusqu'à la J${roundIndex + 1}`);
      
      for (const match of matchesUpToRound) {
        const homeId = match.teams.home.id;
        const awayId = match.teams.away.id;
        const homeGoals = match.goals.home || 0;
        const awayGoals = match.goals.away || 0;
        
        const homeTeam = roundStandingsData.find(t => t.team.id === homeId);
        const awayTeam = roundStandingsData.find(t => t.team.id === awayId);
        
        if (homeTeam) {
          homeTeam.home.played++;
          homeTeam.home.goals.for += homeGoals;
          homeTeam.home.goals.against += awayGoals;
          
          homeTeam.all.played++;
          homeTeam.all.goals.for += homeGoals;
          homeTeam.all.goals.against += awayGoals;
          
          if (homeGoals > awayGoals) {
            homeTeam.home.win++;
            homeTeam.all.win++;
            homeTeam.points += 3;
          } else if (homeGoals === awayGoals) {
            homeTeam.home.draw++;
            homeTeam.all.draw++;
            homeTeam.points += 1;
          } else {
            homeTeam.home.lose++;
            homeTeam.all.lose++;
          }
        }
        
        if (awayTeam) {
          awayTeam.away.played++;
          awayTeam.away.goals.for += awayGoals;
          awayTeam.away.goals.against += homeGoals;
          
          awayTeam.all.played++;
          awayTeam.all.goals.for += awayGoals;
          awayTeam.all.goals.against += homeGoals;
          
          if (awayGoals > homeGoals) {
            awayTeam.away.win++;
            awayTeam.all.win++;
            awayTeam.points += 3;
          } else if (awayGoals === homeGoals) {
            awayTeam.away.draw++;
            awayTeam.all.draw++;
            awayTeam.points += 1;
          } else {
            awayTeam.away.lose++;
            awayTeam.all.lose++;
          }
        }
      }
      
      roundStandingsData.sort((a, b) => {
        if (a.points !== b.points) return b.points - a.points;
        const gdA = (a.all.goals.for - a.all.goals.against);
        const gdB = (b.all.goals.for - b.all.goals.against);
        if (gdA !== gdB) return gdB - gdA;
        return (b.all.goals.for || 0) - (a.all.goals.for || 0);
      });
      
      roundStandingsData.forEach((team, idx) => {
        team.rank = idx + 1;
      });
      
      const last5Matches = [...matchesUpToRound]
        .sort((a, b) => new Date(b.fixture.date) - new Date(a.fixture.date))
        .slice(0, 5);
      
      roundStandingsData.forEach(team => {
        const teamLast5 = last5Matches
          .filter(m => m.teams.home.id === team.team.id || m.teams.away.id === team.team.id)
          .map(m => {
            const isHome = m.teams.home.id === team.team.id;
            const gF = isHome ? m.goals.home : m.goals.away;
            const gA = isHome ? m.goals.away : m.goals.home;
            if (gF > gA) return "W";
            if (gF < gA) return "L";
            return "D";
          })
          .join('');
        
        team.form = teamLast5 || "";
      });
      
      setRoundStandings({
        league: fullStandings[0].league,
        standings: [roundStandingsData],
        roundName: roundName,
        roundIndex: roundIndex + 1
      });
      
      console.log(`✅ Classement après J${roundIndex + 1} calculé`);
      
    } catch (error) {
      console.error("Erreur lors du calcul du classement:", error);
    } finally {
      setLoadingRound(false);
    }
  };

  // Quand on change de journée, recalculer le classement
  useEffect(() => {
    if (viewMode === "classement-journee" && selectedRound) {
      loadRoundStandings(selectedRound);
    } else {
      setRoundStandings(null);
    }
  }, [selectedRound, viewMode, lid, season]);

  const openMatchDetail = async (id) => {
    setDetailMatch({ loading: true });
    try {
      const fx = await api(`/fixtures?id=${id}`, 30000);
      const fix = fx[0];
      if (!fix) throw new Error("Match introuvable");
      const hid = fix.teams.home.id, aid = fix.teams.away.id, fid = fix.fixture.id;
      const isLive = LIVE_ST.has(fix.fixture.status.short);
      const isDone = DONE_ST.has(fix.fixture.status.short);
      const detailTTL = isLive ? 15000 : isDone ? 10800000 : 3600000;

const _algerianScorersCache = { data: null, ts: 0 };

async function buildAlgerianScorers(season) {

  if (_algerianScorersCache.data && Date.now() - _algerianScorersCache.ts < 1800000) {
    return _algerianScorersCache.data;
  }

  const fixtures = await api(`/fixtures?league=186&season=${season}`, 3600000);
  if (!fixtures || fixtures.length === 0) return [];

  const finished = fixtures.filter(f => DONE_ST.has(f.fixture.status.short));
  if (finished.length === 0) return [];

  const scorersMap = new Map();
  const allFinishedIds = finished.map(f => f.fixture.id);

  const BATCH = 8;
  for (let i = 0; i < allFinishedIds.length; i += BATCH) {
    const batch = allFinishedIds.slice(i, i + BATCH);
    const results = await Promise.allSettled(
      batch.map(id => api(`/fixtures/events?fixture=${id}`, 86400000))
    );

    results.forEach(r => {
      if (r.status !== "fulfilled") return;
      const events = r.value || [];
      events.forEach(e => {
        if (e.type !== "Goal" || e.detail === "Missed Penalty" || e.detail === "Own Goal") return;
        const pid = e.player?.id;
        const pname = e.player?.name;
        if (!pid || !pname) return;
        if (scorersMap.has(pid)) {
          scorersMap.get(pid).goals++;
        } else {
          scorersMap.set(pid, {
            player: { id: pid, name: pname, photo: `https://media.api-sports.io/football/players/${pid}.png` },
            team: { id: e.team?.id, name: e.team?.name, logo: `https://media.api-sports.io/football/teams/${e.team?.id}.png` },
            goals: 1
          });
        }
      });
    });
  }

  const result = Array.from(scorersMap.values())
    .map(s => ({
      player: s.player,
      statistics: [{ team: s.team, goals: { total: s.goals }, games: { appearences: 0 } }]
    }))
    .sort((a, b) => b.statistics[0].goals.total - a.statistics[0].goals.total)
    .slice(0, 30);

  _algerianScorersCache.data = result;
  _algerianScorersCache.ts = Date.now();
  return result;
}

  const [expandedH2H, setExpandedH2H] = useState(null);
  const [h2hData, setH2hData] = useState({});

  const getWeekRange = (offset) => {
    const now = new Date();
    const day = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
    monday.setHours(0, 0, 0, 0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23, 59, 59, 0);
    return { from: monday, to: sunday };
  };

  const weekRange = getWeekRange(weekOffset);
  const fromStr = weekRange.from.toISOString().slice(0, 10);
  const toStr   = weekRange.to.toISOString().slice(0, 10);

  const fmtWeekLabel = () => {
    const opts = { day: "numeric", month: "short" };
    const f = weekRange.from.toLocaleDateString("fr-FR", opts);
    const t = weekRange.to.toLocaleDateString("fr-FR", opts);
    if (weekOffset === 0) return `Cette semaine · ${f} – ${t}`;
    if (weekOffset === 1) return `Semaine prochaine · ${f} – ${t}`;
    if (weekOffset === -1) return `Semaine passée · ${f} – ${t}`;
    return `${f} – ${t}`;
  };

  useEffect(() => {

    setStatus("load");

      ? `/fixtures?league=${lid}&season=${season}&from=${fromStr}&to=${toStr}&status=FT`
      : `/fixtures?league=${lid}&season=${season}&from=${fromStr}&to=${toStr}`;

      .catch(() => { if (mounted) setStatus("err"); });

        api(`/fixtures/headtohead?h2h=${hid}-${aid}&last=50`, 86400000).then(d => upd({ h2h: d })).catch(() => {}),
        api(`/injuries?fixture=${fid}`, isDone ? 10800000 : 3600000).then(d => upd({ injuries: d })).catch(() => {}),

  "free":  { label: "Gratuit",  bg: "linear-gradient(135deg,#00c170,#009e5c)", icon: "🆓" },
  "loan":  { label: "Prêt",     bg: "linear-gradient(135deg,#2563eb,#1d4ed8)", icon: "🔄" },
  "n/a":   { label: "—",        bg: "linear-gradient(135deg,#94a3b8,#64748b)", icon: "" },
};
function getTypeInfo(type) {
  if (!type) return { label: "—", bg: "linear-gradient(135deg,#94a3b8,#64748b)", icon: "" };

  if (TYPE_MAP[lo]) return TYPE_MAP[lo];
  return { label: type, bg: "linear-gradient(135deg,#f59e0b,#d97706)", icon: "💶" };
}

function TransfersTab({ onTeam }) {
  const [mainTab,       setMainTab]       = useState("mercato");

  useEffect(() => {

    const seasonCutoff = new Date("2025-01-01"); // Seulement entraîneurs arrivés en 2025+

            const current = coachesList[0];

            const stint = (current.career||[]).find(s => s.team?.id === c.id);
            return { clubId: c.id, clubName: c.name, clubLogo: c.logo, coach: { ...current, photo }, stint };

        const startDate = stint?.start ? new Date(stint.start) : null;
        const endDate = stint?.end ? new Date(stint.end) : null;

        // Ignorer si l'entraîneur est parti (end renseigné et récent)
        if (endDate && endDate < new Date()) return;

        // Garder seulement ceux arrivés en 2025 ou sans date (= actuel)
        if (startDate && startDate < seasonCutoff) return;

        entries.push({ coach, clubId, clubName, clubLogo, start: stint?.start || null, end: null, isCurrent: true });
      });

      // Dédupliquer par club — garder l'entrée avec photo ET date la plus récente
      const deduped = [];
      const seenByClub = {};
      entries.forEach(entry => {
        const key = entry.clubId;
        if (!seenByClub[key]) {
          seenByClub[key] = entry;
        } else {
          const existing = seenByClub[key];
          const existingScore = (existing.isCurrent ? 100 : 0) + (existing.coach.photo ? 10 : 0);
          const entryScore = (entry.isCurrent ? 100 : 0) + (entry.coach.photo ? 10 : 0);
          if (entryScore > existingScore) seenByClub[key] = entry;
          // Si même score → garder la date la plus ancienne (vraie prise de poste)
          else if (entryScore === existingScore && new Date(entry.start||0) < new Date(existing.start||0)) seenByClub[key] = entry;
        }
      });
      const dedupedEntries = Object.values(seenByClub);
      dedupedEntries.sort((a, b) => {
        if (a.isCurrent && !b.isCurrent) return -1;
        if (!a.isCurrent && b.isCurrent) return 1;
        return new Date(b.start||0) - new Date(a.start||0);
      });
      setCoachesData(dedupedEntries);
      setCoachesStatus(dedupedEntries.length ? "ok" : "empty");
    });

      const source1 = {};

          if(!stint) return;

          const startDate = stint.start ? new Date(stint.start) : null;
          const endDate   = stint.end   ? new Date(stint.end)   : null;
          const isCurrent = idx === 0 && !stint.end; // Premier = actuel

          if(startDate && startDate >= seasonStart && startDate <= now) {
            const day = startDate.getDate();

            const isGeneric = (day === 1 && (month === 6 || month === 0 || month === 7));
            // Score de fiabilité : plus c'est précis, plus c'est fiable
            const reliability = isGeneric ? 0.3 : isCurrent ? 1.0 : 0.7;
            if(reliability >= 0.3) {
              arrivals.push({
                coachName: coach.name,
                coachPhoto: coach.photo || null,
                coachId: coach.id,
                coachNationality: coach.nationality,
                coachAge: coach.age,
                date: stint.start,
                dateReliable: !isGeneric,
                isCurrent,
                reliability,
                club

            }
          }

          // ── Détection DÉPART ──
          // Critères : endDate dans la saison ou l'année précédente ET n'est plus actuel

              coachPhoto: coach.photo || null,
              coachId: coach.id,
              coachNationality: coach.nationality,
              coachAge: coach.age,
              date: stint.end,
              dateReliable: true,
              reliability: 1.0,
              club
            });
          }
        });
      });

      // Pour chaque entrée sans photo → tenter getCoachPhoto
      const enrich = async (list) => {
        return Promise.all(list.map(async entry => {
          if(!entry.coachPhoto && entry.coachId) {
            const photo = await getCoachPhoto(entry.coachName, entry.coachId);
            return { ...entry, coachPhoto: photo };
          }
          return entry;
        }));
      };

      // ─── DÉDUPLICATION INTELLIGENTE ───
      // Clé = 6 premiers chars du nom normalisé + clubId
      // Garde : photo > reliability > date ancienne
      const dedupSmart = (list) => {
        const seen = {};
        list.forEach(t => {
          const nameKey = t.coachName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f\s\.]/g,'').slice(0,7);
          const key = `${nameKey}_${t.club.id}`;
          if(!seen[key]) {
            seen[key] = t;
          } else {
            const e = seen[key];
            const eScore = (e.coachPhoto?4:0) + (e.dateReliable?2:0) + (e.isCurrent?1:0);
            const tScore = (t.coachPhoto?4:0) + (t.dateReliable?2:0) + (t.isCurrent?1:0);
            if(tScore > eScore) seen[key] = t;
            else if(tScore === eScore && new Date(t.date||0) < new Date(e.date||0)) seen[key] = t;
          }
        });
        return Object.values(seen);
      };

      const [enrichedArrivals, enrichedDepartures] = await Promise.all([
        enrich(dedupSmart(arrivals)),
        enrich(dedupSmart(departures))
      ]);

      // Trier : fiabilité décroissante, puis date décroissante
      const sortFn = (a,b) => (b.reliability-a.reliability) || (new Date(b.date)-new Date(a.date));
      setCoachTransfers({
        arrivals: enrichedArrivals.sort(sortFn),
        departures: enrichedDepartures.sort(sortFn)

    };

      var fixtures = results[0] || [];
      var standingsData = results[1] || [];
      var allTeams = [];
      try { allTeams = standingsData[0].league.standings[0] || []; } catch(e) {}
      setTotal(allTeams.length || 16);
      var teamInfo = {};
      allTeams.forEach(function(t) { teamInfo[t.team.id] = {logo:t.team.logo, name:t.team.name}; });
      var sorted = fixtures.slice().sort(function(a,b){return new Date(a.fixture.date)-new Date(b.fixture.date);});
      var journeeMap = {};
      sorted.forEach(function(f) {
        var round = f.league && f.league.round || '';
        var nums = round.match(/[0-9]+/);
        var jNum = nums ? parseInt(nums[0]) : 0;
        if(!jNum || jNum > 30) return;
        if(!journeeMap[jNum]) journeeMap[jNum] = [];

      var teamPoints={}, teamGD={}, teamGF={};
      allTeams.forEach(function(t){teamPoints[t.team.id]=0;teamGD[t.team.id]=0;teamGF[t.team.id]=0;});
      var journees = Object.keys(journeeMap).map(Number).sort(function(a,b){return a-b;});
      var progression = [];
      journees.forEach(function(jNum) {
        var ourMatch = null;

        var pos=-1;
