function TeamPage({ teamId, teamName, teamLogo, leagueId, season, onClose, onTeam }) {
  const [info,      setInfo]      = useState(null);
  const [results,   setResults]   = useState([]);
  const [upcoming,  setUpcoming]  = useState([]);
  const [standings, setStandings] = useState([]);
  const [squad,     setSquad]     = useState([]);
  const [squadStats, setSquadStats] = useState({}); // playerId → stats saison
  const [playerPage, setPlayerPage] = useState(null);
  const [transfers, setTransfers] = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [tab,       setTab]       = useState("resultats");
  const [trFilter,  setTrFilter]  = useState("all"); // all | in | out
  const [detailMatch, setDetailMatch] = useState(null);
  const [teamLeagues, setTeamLeagues] = useState([]); // [{id, name, logo, season}]
  const [selLeagueId, setSelLeagueId] = useState(null);
  const [selSeason, setSelSeason] = useState(null);
  const [standingsFiltered, setStandingsFiltered] = useState([]);
  const [loadingStand, setLoadingStand] = useState(false);

  const openMatchDetail = async (fixtureId) => {
    setDetailMatch({ loading: true });
    try {
      const fx = await api(`/fixtures?id=${fixtureId}`, 30000);
      const fix = fx?.[0];
      if(!fix) throw new Error("Match introuvable");
      const hid = fix.teams.home.id, aid = fix.teams.away.id, fid = fix.fixture.id;
      const isLive = LIVE_ST.has(fix.fixture.status.short);
      const isDone = DONE_ST.has(fix.fixture.status.short);
      const ttl = isLive ? 15000 : isDone ? 10800000 : 3600000;
      setDetailMatch({ partial: true, data: { fixture: fix, stats: [], events: [], lineups: [], players: [], h2h: [], injuries: [] } });
      const upd = patch => setDetailMatch(prev => prev?.data ? { ...prev, partial: true, data: { ...prev.data, ...patch } } : prev);
      await Promise.allSettled([
        api(`/fixtures/events?fixture=${fid}`, ttl).then(d => upd({ events: d })).catch(() => {}),
        api(`/fixtures/statistics?fixture=${fid}`, ttl).then(d => upd({ stats: d })).catch(() => {}),
        api(`/fixtures/lineups?fixture=${fid}`, ttl).then(d => upd({ lineups: d })).catch(() => {}),
        api(`/fixtures/players?fixture=${fid}`, ttl).then(d => upd({ players: d })).catch(() => {}),
        api(`/fixtures/headtohead?h2h=${hid}-${aid}&last=20`, 86400000).then(d => upd({ h2h: d })).catch(() => {}),
      ]);
      setDetailMatch(prev => prev?.data ? { ...prev, partial: false } : prev);
    } catch(e) { setDetailMatch({ error: e.message }); }
  };

  useEffect(() => {
    if(!teamId) return;
    let cancelled = false;
    setLoading(true);
    setResults([]); setUpcoming([]); setStandings([]); setSquad([]); setTransfers([]);
    // Invalider le cache des fixtures pour toujours avoir les derniers résultats
    try {
      const cacheKey1 = `wf_api_/fixtures?team=${teamId}&season=${season || (new Date().getMonth()>=6?new Date().getFullYear():new Date().getFullYear()-1)}`;
      const cacheKey2 = `wf_api_/fixtures?team=${teamId}&next=15`;
      localStorage.removeItem(cacheKey1);
      localStorage.removeItem(cacheKey2);
    } catch(e) {}

    const curSeason = season || (new Date().getMonth() >= 6 ? new Date().getFullYear() : new Date().getFullYear()-1);

    Promise.allSettled([
      api(`/teams?id=${teamId}`, 86400000),
      api(`/fixtures?team=${teamId}&season=${curSeason}`, 3600000),
      api(`/fixtures?team=${teamId}&season=${curSeason-1}`, TTL.DONE),
      api(`/fixtures?team=${teamId}&next=15`, 3600000),
      api(`/players/squads?team=${teamId}`, 86400000),
      api(`/transfers?team=${teamId}`, 86400000),
    ]).then(async ([rInfo, rRes, rResPrev, rNext, rSquad, rTransfers]) => {
      if(cancelled) return;

      if(rInfo.status==="fulfilled") setInfo(rInfo.value?.[0]||null);

      const DONE_S = new Set(["FT","AET","PEN","AWD","WO"]);
      const allFix = [
        ...(rRes.status==="fulfilled" ? rRes.value||[] : []),
        ...(rResPrev.status==="fulfilled" ? rResPrev.value||[] : []),
      ];
      const done = allFix
        .filter(f => DONE_S.has(f.fixture?.status?.short))
        .sort((a,b)=>new Date(b.fixture.date)-new Date(a.fixture.date))
        .slice(0,40);
      setResults(done);

      const nxt = rNext.status==="fulfilled" ? rNext.value||[] : [];
      setUpcoming(nxt);

      // Standings
      const allFixStand = [...done, ...nxt];
      const det = allFixStand.find(f=>f.league?.id);
      const lid  = leagueId || det?.league?.id || 186;
      const seas = season   || det?.league?.season || curSeason;

      // Construire liste des compétitions de l'équipe (depuis les fixtures)
      // Dédupliquer par league.id uniquement (éviter doublons entre saisons)
      var leagueMap = {};
      allFixStand.forEach(function(f) {
        if(!f.league || !f.league.id) return;
        var key = f.league.id; // clé = ID uniquement, pas saison
        if(!leagueMap[key]) {
          leagueMap[key] = {
            id: f.league.id,
            name: f.league.name,
            logo: f.league.logo,
            season: seas // utiliser la saison courante
          };
        }
      });
      var leaguesList = Object.values(leagueMap).sort(function(a,b) {
        if(a.id === lid) return -1;
        if(b.id === lid) return 1;
        return 0;
      });
      // Si aucune ligue trouvée depuis fixtures, créer une entrée par défaut
      if(leaguesList.length === 0) {
        var defaultFix = allFixStand.find(function(f){return f.league&&f.league.id;});
        if(defaultFix) {
          leaguesList = [{id:defaultFix.league.id, name:defaultFix.league.name, logo:defaultFix.league.logo, season:seas}];
        }
      }
      if(!cancelled) setTeamLeagues(leaguesList);

      // Charger standings de la ligue principale
      const rStand = await api(`/standings?league=${lid}&season=${seas}`, TTL.DONE).catch(()=>null);
      if(!cancelled && rStand) {
        const rows = (rStand||[]).flatMap(g=>Array.isArray(g)?g:(g?.league?.standings||[]).flat());
        setStandings(rows);
        setStandingsFiltered(rows);
        setSelLeagueId(lid);
        setSelSeason(seas);
      }

      if(rSquad.status==="fulfilled") {
        const sq = rSquad.value?.[0]?.players||[];
        
        // Pour clubs algériens → enrichir depuis Supabase (valeurs marchandes sync chaque lundi)
        const ALGERIA_API_IDS = [918,904,906,910,908,916,907,905,917,919,920,921,922,923,924,925];

function App() {

  const [currentTab, setCurrentTab] = useState(() => {
    try { return sessionStorage.getItem("wf_last_tab") || "scores"; }
    catch { return "scores"; }
  });

  const [apiCallsToday, setApiCallsToday] = useState(0);

  // Demander permission notifications au lancement
  useEffect(() => {
    if ("Notification" in window && Notification.permission === "default") {
      setTimeout(() => {
        Notification.requestPermission();
      }, 3000);
    }
  }, []);

  useEffect(() => {
    try {
      const today = new Date().toDateString();
      const calls = localStorage.getItem('wf_api_calls_' + today);
      setApiCallsToday(parseInt(calls) || 0);
    } catch {
      setApiCallsToday(0);
    }

    const interval = setInterval(() => {
      try {
        const today = new Date().toDateString();
        const calls = localStorage.getItem('wf_api_calls_' + today);
        setApiCallsToday(parseInt(calls) || 0);
      } catch {}
    }, 30000);

    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    try { sessionStorage.setItem("wf_last_tab", currentTab); }
    catch {}
  }, [currentTab]);

  const [teamPageStack, setTeamPageStack] = useState([]);
  const lastOpenTeamRef = useRef(0);
  const openTeam = useCallback((teamId, teamName, teamLogo, leagueId, season) => {
    const now = Date.now();
    if(now - lastOpenTeamRef.current < 600) return; // ignorer si appelé < 600ms après
    lastOpenTeamRef.current = now;
    setTeamPageStack(prev => [...prev, { teamId, teamName, teamLogo, leagueId, season }]);
  }, []);
  const closeTeam = useCallback(() => {
    setTeamPageStack(prev => prev.slice(0, -1));
  }, []);

  const [favs, setFavs] = useState(() => {
    try {
      const saved = localStorage.getItem("wf_favs");
      return saved ? new Set(JSON.parse(saved)) : new Set();
    } catch {
      return new Set();
    }
  });

  useEffect(() => {
    try { localStorage.setItem("wf_favs", JSON.stringify([...favs])); }
    catch {}
    // Envoyer les favoris au SW + démarrer surveillance arrière-plan
    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.controller.postMessage({
        type: favs.size > 0 ? 'START_GOAL_CHECK' : 'STOP_GOAL_CHECK'
      });
      navigator.serviceWorker.controller.postMessage({ type: 'UPDATE_FAVS' });
    }
  }, [favs]);

  // Répondre aux demandes de favoris du SW
  useEffect(() => {
    const handler = e => {
      if (e.data?.type === 'GET_FAVS') {
        e.ports[0]?.postMessage([...favs]);
      }
    };
    navigator.serviceWorker?.addEventListener('message', handler);
    return () => navigator.serviceWorker?.removeEventListener('message', handler);
  }, [favs]);

  const toggleFav = useCallback((id) => {
    setFavs(prev => {
      const newSet = new Set(prev);
      if (newSet.has(id)) newSet.delete(id);
      else newSet.add(id);
      return newSet;
    });
  }, []);

  const tabs = [
    { id: "scores", label: "SCORES" },
    { id: "standings", label: "CLASSEMENT" },

  const renderContent = () => {
    switch (currentTab) {
      case "scores": return React.createElement(ScoresTab, { key:"scores", favs, onFav: toggleFav, onTeam: openTeam });
      case "standings": return React.createElement(StandingsTab, { key:"standings", onTeam: openTeam });
      case "scorers": return React.createElement(ScorersTab, { key:"scorers" });
      case "calendar": return React.createElement(CalendarTab, { key:"calendar", favs, onFav: toggleFav, onTeam: openTeam });

    }
